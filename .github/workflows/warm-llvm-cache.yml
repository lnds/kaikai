name: warm-llvm-cache

# Keeps the vendored static-libLLVM cache populated so the release job
# hits it instead of paying a ~25-min cold build per platform.
#
# A release cannot keep its own cache warm: GitHub scopes a cache to the
# ref that wrote it, so what a tag saves is unreadable from the next tag.
# Only the default branch is readable from everywhere, which is what this
# job writes to. It builds against the SAME key and paths as release.yml,
# on every platform the release builds — a platform missing from the
# matrix has no warmer at all.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC: a hit only restores, and keeps the entry recent for the LRU
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  warm:
    name: Warm libLLVM cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Must match release.yml and mk/llvm.mk.
      LLVM_VERSION: 18.1.8
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake + ninja [macOS]
        if: runner.os == 'macOS'
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            brew install cmake ninja
          fi

      - name: Install cmake + ninja [Linux]
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      # Same key + paths as release.yml so this run's saved cache is the
      # one the release job restores.
      - name: Cache vendored static libLLVM
        uses: actions/cache@v4
        with:
          path: |
            stage0/third_party/llvm
            stage0/third_party/cmake
            stage0/third_party/llvm-${{ env.LLVM_VERSION }}.src.tar.xz
            stage0/third_party/cmake-${{ env.LLVM_VERSION }}.src.tar.xz
          key: llvm-static-${{ runner.os }}-${{ env.LLVM_VERSION }}-${{ hashFiles('mk/llvm.mk') }}
          restore-keys: |
            llvm-static-${{ runner.os }}-${{ env.LLVM_VERSION }}-

      # Idempotent: a restored build/ is a no-op, a miss pays the cold
      # build. So this step's own duration reports whether the cache
      # survived since the last run — minutes means it did, ~20 min means it did not.
      - name: Build libLLVM
        run: make llvm-build
