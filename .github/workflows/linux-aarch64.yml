name: linux-aarch64

# The C backend on aarch64 Linux under the system GCC. Every other Linux job
# runs x86_64 and every other aarch64 job runs macOS under clang, so this is
# the one place the runtime's aarch64 paths meet GCC and ELF: the stack-segment
# switch, the fiber stacks, the M:N scheduler.
#
# It boots from the seed, the route a machine with only `cc` takes, and builds
# its own compiler: artifacts do not cross workflows.
#
# Path-gated on pull requests and not a required check; the nightly run covers
# what a change outside those paths can still move.
on:
  pull_request:
    paths:
      - 'stage0/**'
      - 'stage2/runtime.h'
      - 'stage2/Makefile'
      - 'scripts/build-release.sh'
      - 'install.sh'
      - '.github/workflows/linux-aarch64.yml'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: linux-aarch64-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      KAIC_BOOT: seed
      KAI_BACKEND: c
      MN_CORPUS_RUN_TIMEOUT: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the bootstrap seeds
        run: git fetch --depth=1 origin 'refs/tags/bootstrap-seed-v*:refs/tags/bootstrap-seed-v*'

      # The job is about GCC: a runner image whose `cc` became clang would
      # keep it green while testing nothing it exists for.
      - name: The system compiler is GCC
        run: |
          uname -m
          cc --version | head -1
          getconf GNU_LIBC_VERSION
          echo "page size: $(getconf PAGESIZE)"
          echo "BTI by default: $(echo | cc -dM -E - | grep -c __ARM_FEATURE_BTI_DEFAULT || true)"
          [ "$(uname -m)" = aarch64 ] || { echo "::error::not an aarch64 runner"; exit 1; }
          echo | cc -dM -E - | grep -q '__GNUC__' && ! echo | cc -dM -E - | grep -q '__clang__' \
            || { echo "::error::cc is not GCC"; exit 1; }

      - name: cc -> seed -> kaic2
        env:
          KAIC_BOOT_MODULAR: 1
        run: make kaic2

      # The second generation is compiled unoptimised: it runs once, and it
      # must still emit what the optimised compiler emitted.
      - name: Self-host
        run: make -C stage2 selfhost SELFHOST_ONCE=1

      - name: Stack-segment switch, driven from C
        run: make -C stage2 test-segment-switch test-segment-runtime test-segment-handles

      # A modular build links one runtime owner beside the program's units; a
      # single-unit build holds the runtime itself. Every unit assembles the
      # switch and the copies must link as one symbol the program does not
      # export. Unoptimised units reference it even where nothing calls it,
      # position-independent code takes its stub's address, and branch
      # protection picks how it returns.
      - name: Segments past a fiber's stack, per link shape, optimisation and branch protection
        run: |
          set -eu
          fix=examples/perceus/seq_deep_in_fiber
          for modular in 1 0; do
            for opt in -O2 -O0; do
              for prot in none standard; do
                tag="modular=$modular $opt branch-protection=$prot"
                exe="$RUNNER_TEMP/deep-m$modular$opt-$prot"
                KAI_MODULAR=$modular \
                  CFLAGS="-std=c99 -Wno-unused-function -Wno-unused-variable $opt -mbranch-protection=$prot" \
                  bin/kai build "$fix.kai" -o "$exe"
                for n in 1 4; do
                  KAI_THREADS=$n "$exe" > "$exe.out" \
                    || { echo "::error::$tag KAI_THREADS=$n: exit $?"; exit 1; }
                  diff -u "$fix.out.expected" "$exe.out"
                done
                defs="$(nm "$exe" | grep -c ' kai_seg_switch$' || true)"
                [ "$defs" = 1 ] || { echo "::error::$tag: $defs kai_seg_switch symbols"; exit 1; }
                if nm -D "$exe" | grep -q ' kai_seg_'; then
                  echo "::error::$tag: the switch is exported"; exit 1
                fi
                echo "OK $tag"
              done
            done
          done

      - name: Lazy sequences
        run: tools/test-seq.sh c

      - name: Effects goldens
        run: TARGET_BACKEND=c tools/test-effects-goldens.sh

      - name: One thread against four over effects, segments, RC and actors
        run: |
          MN_CORPUS_BACKENDS=c MN_CORPUS_THREADS=4 MN_CORPUS_REPEATS=2 \
          MN_CORPUS_DIRS="examples/effects examples/segments examples/perceus examples/actors" \
            tools/ci-bounded-step.sh 2400 linux-aarch64/mn-corpus tools/run-mn-corpus-determinism.sh

      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after linux-aarch64"; git status; exit 1
          fi

  # The tarball as release.yml builds it. Only the published libLLVM asset
  # is accepted: a source build here would hide a missing one.
  tarball:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      # build-release.sh boots from the newest bootstrap-seed tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned clang (native runtime bitcode)
        run: ./tools/ci-install-toolchain.sh bitcode

      - name: Fetch prebuilt static libLLVM
        env:
          KAI_LLVM_PREBUILT_REPO: ${{ github.repository }}
        run: ./scripts/llvm-prebuilt.sh fetch

      - name: Build release tarball
        run: ./scripts/build-release.sh

      # aarch64 kernels run 4, 16 and 64 KiB pages, and a binary whose
      # segments are aligned to less than the page does not load.
      - name: The shipped binaries load on 64 KiB pages
        run: |
          set -eu
          tar -xzf dist/kaikai-v*-linux-aarch64.tar.gz -C "$RUNNER_TEMP"
          top="$(echo "$RUNNER_TEMP"/kaikai-v*-linux-aarch64)"
          for b in bin/kai libexec/kaikai/kaic2 libexec/kaikai/kai-pkg libexec/kaikai/kai-lsp; do
            for align in $(readelf -lW "$top/$b" | awk '$1 == "LOAD" { print $NF }'); do
              echo "$b: LOAD aligned to $align"
              [ "$((align))" -ge 65536 ] || { echo "::error::$b has a segment aligned to $align"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: kaikai-linux-aarch64
          path: dist/kaikai-v*-linux-aarch64.tar.gz*
          retention-days: 7
          if-no-files-found: error

  # install.sh puts that tarball on a clean current distribution, where the
  # distribution's own cc compiles the runtime for both backends.
  install:
    needs: tarball
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:rolling', 'debian:stable', 'fedora:latest']
    container: ${{ matrix.image }}
    steps:
      - name: Install curl, tar and the distribution's cc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl tar gzip gcc libc6-dev
          else
            dnf install -y curl tar gzip gawk findutils diffutils gcc
          fi

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kaikai-linux-aarch64
          path: site

      - name: install.sh from a local release site
        run: |
          set -eu
          tag="v$(cat VERSION)"
          tarball="kaikai-$tag-linux-aarch64.tar.gz"
          site="$PWD/site"
          printf '{"schema":1,"version":"%s","tag":"%s","platforms":{"linux-aarch64":{"url":"file://%s/%s","sha256":"%s"}}}\n' \
            "${tag#v}" "$tag" "$site" "$tarball" "$(awk 'NR==1{print $1}' "$site/$tarball.sha256")" > "$site/latest.json"
          getconf GNU_LIBC_VERSION
          cc --version | head -1
          echo "page size: $(getconf PAGESIZE)"
          KAIKAI_DIST_BASE="file://$site" sh install.sh
          cat "$HOME/.kaikai/share/kaikai/REQUIRES"

      - name: Both backends on the installed toolchain
        run: |
          set -eu
          PATH="$HOME/.kaikai/bin:$PATH"
          work="$(mktemp -d)"
          printf 'fn main() : Unit / Console = print("hola installed mode")\n' > "$work/hello.kai"
          fix=examples/perceus/seq_deep_in_fiber
          for backend in native c; do
            echo "$backend: hello"
            KAI_BACKEND=$backend timeout 300 kai run "$work/hello.kai" > "$work/hello.out" \
              || { echo "::error::$backend: hello exit $?"; exit 1; }
            grep -qx 'hola installed mode' "$work/hello.out" \
              || { echo "::error::$backend: hello printed"; cat "$work/hello.out"; exit 1; }
            echo "$backend: build $fix"
            KAI_BACKEND=$backend timeout 300 kai build "$fix.kai" -o "$work/deep-$backend" \
              || { echo "::error::$backend: build exit $?"; exit 1; }
            for n in 1 4; do
              echo "$backend: run at KAI_THREADS=$n"
              KAI_THREADS=$n timeout 60 "$work/deep-$backend" > "$work/deep.out" \
                || { echo "::error::$backend KAI_THREADS=$n: exit $?"; exit 1; }
              diff -u "$fix.out.expected" "$work/deep.out"
            done
            echo "OK $backend"
          done
