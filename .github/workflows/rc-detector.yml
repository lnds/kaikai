name: rc-detector

# RC self-host detector — runs a directed RC corpus under ASAN +
# no-cell-pool and a strict per-tag ledger on BOTH backends, asserting
# that no cell is freed more than it was allocated (the double-free /
# use-after-free family the cell pool masks and the C oracle shares).
#
# NOT a per-PR merge gate: it is heavy (x2 backends x corpus) and would tax
# every PR. On PRs, tier1-native.yml calls this workflow with its
# `kaic2-native` artifact, path-gated to the code that can introduce an RC
# regression. The daily cron and manual dispatch run it standalone, and
# `make rc-detector` then builds its own native kaic2. The native half needs
# libLLVM; ubuntu-latest + apt llvm-dev provides it.
on:
  workflow_call:
    inputs:
      artifact:
        description: Name of a native bootstrap-chain artifact from the calling run; empty builds one.
        type: string
        default: ''
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The boot of stage2.c (docs/build-system.md §KAIC_BOOT). A caller's env
# does not reach a called workflow, and a mode that disagrees with the
# artifact's stage2.c.id rebuilds stage2.c.
env:
  KAIC_BOOT: release

jobs:
  rc-detector:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install toolchain (clang + libLLVM)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev
          LLVM_CONFIG="$(command -v llvm-config || ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LLVM_CONFIG" ]; then
            echo "::error::no llvm-config found after installing llvm-dev"; exit 1
          fi
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "using $LLVM_CONFIG ($($LLVM_CONFIG --version))"

      - uses: actions/download-artifact@v4
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
      - name: Restore artifact mtimes (no rebuild)
        if: inputs.artifact != ''
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh

      # Bounded under `timeout-minutes` so a wedged fixture fails here,
      # named, instead of burning the job ceiling and reporting `cancelled`
      # — the conclusion a routine supersede also produces.
      - name: "Run RC detector (both backends)"
        run: ./tools/ci-bounded-step.sh 1800 "rc-detector (both backends)" make -C stage2 CC=clang LLVM_CONFIG="$LLVM_CONFIG" rc-detector
