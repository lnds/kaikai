name: daily

# Tier 2 cron — `make daily` once a day on main HEAD plus on manual dispatch.
# Tier 2 (per CLAUDE.md / docs/testing-tiers.md) is diagnostic, not a gate:
# failures here do NOT block PRs. Instead, a failed run opens an issue tagged
# `daily-failure` so the next morning's lane has a concrete entry point.
#
# Schedule: 02:00 UTC ≈ 22:00 / 23:00 Chile (the maintainer's evening). The
# literal time is not load-bearing, the daily cadence is.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-main
  cancel-in-progress: false

# `make daily` split into parallel jobs: one build publishes kaic2, and each
# `daily-part` runs a disjoint piece of the verification on it. The parts
# union to `make daily` (see the `daily:` comment in the Makefile). No `ref:`:
# a dispatch verifies the dispatched branch; the cron runs the default branch.
jobs:
  daily-build:
    runs-on: ubuntu-latest
    # A release boot compiles the whole compiler twice; a slow runner took 34 min.
    timeout-minutes: 75
    env:
      # The boot of stage2.c (docs/build-system.md §KAIC_BOOT).
      KAIC_BOOT: release
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (clang for LLVM backend tests)
        run: |
          command -v clang >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang
          }

      - name: Toolchain versions
        run: |
          cc --version
          clang --version
          make --version | head -1

      - name: Build kaic1 and the release-booted C-only kaic2
        run: make CC=clang kaic1 kaic2

      - uses: actions/upload-artifact@v4
        with:
          name: daily-kaic2-c
          path: |
            stage0/*.o
            stage0/kaic0
            stage1/kaic1
            stage1/build/stage1.c
            stage2/kaic2
            stage2/build/stage2.c
            stage2/build/stage2.c.id
            stage2/build/kaic2.id
          retention-days: 3
          if-no-files-found: error

  daily-part:
    needs: daily-build
    runs-on: ubuntu-latest
    # No object cache here: the shard-4/6 self-hosts compile cold every night,
    # and one took 35 min on a slow runner.
    timeout-minutes: 90
    env:
      KAIC_BOOT: release
    strategy:
      fail-fast: false
      matrix:
        part:
          - tier1-shard-1
          - tier1-shard-2
          - tier1-shard-3
          - tier1-shard-4
          - tier1-shard-5
          - tier1-shard-6
          - tier1-shard-7
          - tier1-shard-8
          - tier1-unsharded
          - daily-tail
    name: daily-part (${{ matrix.part }})
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          command -v clang >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang
          }

      - uses: actions/download-artifact@v4
        with:
          name: daily-kaic2-c

      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh

      - name: make ${{ matrix.part }}
        run: make CC=clang ${{ matrix.part }}

  daily:
    needs: [daily-build, daily-part]
    # `always()`: a part killed at its timeout reports `cancelled`, and that
    # must still reach the gate and the issue below.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the build and every part
        run: |
          echo "build=${{ needs.daily-build.result }} parts=${{ needs.daily-part.result }}"
          [ "${{ needs.daily-build.result }}" = success ] && [ "${{ needs.daily-part.result }}" = success ] \
            || { echo "::error::daily FAIL — the build or a part did not succeed"; exit 1; }
          echo "daily OK — every part green"

      - name: Open issue on daily failure
        # `cancelled()` covers a timeout, which reports `cancelled`, not `failure`.
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          today=$(date -u +%Y-%m-%d)
          # `--label` only attaches a label that already exists; create it
          # idempotently first, else `gh issue create` errors out (which is
          # exactly what silently broke the 2026-06-16 failure run).
          gh label create daily-failure \
            --color B60205 --description "Tier 2 daily cron failure" 2>/dev/null || true
          # One open issue per failure kind, keyed by title prefix (a retitle
          # must keep it): a repeat failure comments there instead.
          open=$(gh issue list --label daily-failure --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("daily: tier 2 cron failed"))][0].number // empty') || open=
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again on $today (commit \`${{ github.sha }}\`): ${run_url}"
            exit 0
          fi
          gh issue create \
            --title "daily: tier 2 cron failed on $today" \
            --label "daily-failure" \
            --body "$(cat <<EOF
          The scheduled \`make daily\` run on \`main\` HEAD (commit \`${{ github.sha }}\`) failed.

          Tier 2 failures are diagnostics, not blockers. Per CLAUDE.md:

          > A \`daily\` failure opens a lane the next morning; do not jam velocity by treating it as a per-PR gate.

          ## Triage path

          1. Inspect the run: ${run_url}
          2. Reproduce locally: \`make CC=clang daily\` (baseline from demos/baseline.txt).
          3. Identify whether the failure is in \`tier1\`, stress fixtures, the coverage probe, or the RC budget.
          4. Open a focused PR fixing the specific gate; close this issue once the next daily run is green.
          EOF
          )"

  # The Tier 1 promise that a machine with only `cc` builds the compiler:
  # cc -> the frozen seed -> kaic2, no prior kaikai binary, the runner's own
  # cc. Every other CI build boots from the release, so this is where the
  # seed is verified. Each boot's kaic2 must be a fixed point, and the two
  # must emit byte-identical C for the compiler itself and a sample program.
  # The boots are independent until that comparison, so they run in parallel.
  # No `ref:`: a dispatch verifies the dispatched branch.
  bootstrap-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        boot: [release, seed]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the bootstrap seeds
        if: matrix.boot == 'seed'
        run: git fetch --depth=1 origin 'refs/tags/bootstrap-seed-v*:refs/tags/bootstrap-seed-v*'

      - name: ${{ matrix.boot }} -> kaic2, a fixed point over its kaic2-a
        run: |
          cc --version | head -1
          make kaic-boot-verify-one BOOT=${{ matrix.boot }}

      - uses: actions/upload-artifact@v4
        with:
          name: boot-verify-${{ matrix.boot }}
          path: |
            stage2/build/boot-verify/${{ matrix.boot }}/self.c
            stage2/build/boot-verify/${{ matrix.boot }}/sample.c
          retention-days: 3

  bootstrap-from-scratch:
    needs: bootstrap-boot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Require both boots
        if: needs.bootstrap-boot.result != 'success'
        run: |
          echo "a boot job did not succeed: ${{ needs.bootstrap-boot.result }}"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          pattern: boot-verify-*
          path: boot-verify

      - name: release- and seed-booted kaic2 emit the same C
        run: |
          for b in release seed; do
            mkdir -p stage2/build/boot-verify/$b
            cp boot-verify/boot-verify-$b/self.c boot-verify/boot-verify-$b/sample.c stage2/build/boot-verify/$b/
          done
          make kaic-boot-verify-cross

      - name: Open issue on failure
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          today=$(date -u +%Y-%m-%d)
          gh label create daily-failure \
            --color B60205 --description "Tier 2 daily cron failure" 2>/dev/null || true
          open=$(gh issue list --label daily-failure --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("daily: bootstrap from scratch failed"))][0].number // empty') || open=
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again on $today (commit \`${{ github.sha }}\`): ${run_url}"
            exit 0
          fi
          gh issue create \
            --title "daily: bootstrap from scratch failed on $today" \
            --label "daily-failure" \
            --body "The scheduled cc -> seed -> kaic2 bootstrap on \`main\` (commit \`${{ github.sha }}\`) failed: ${run_url}. Reproduce with \`make kaic-boot-verify\` from a clean checkout with the seed tags fetched."
