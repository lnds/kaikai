name: rc-native-census

# RC census over the FULL golden corpus (examples/perceus +
# examples/effects) on the NATIVE backend — the default backend users
# run — under ASAN + no-cell-pool with the runtime cc-compiled so ASAN
# instruments it (bitcodes hidden; see tools/rc-native-census.sh).
#
# The directed rc-detector gate covers the known RC bug shapes on both
# backends per PR; this census covers the whole corpus so a native-only
# RC bug outside the directed set cannot sit unmeasured (the C and
# native emitters have shipped the same defect independently before —
# the census is what finds the mirror). Heavy (320 native ASAN builds),
# so it is a daily cron + dispatch, not a per-PR gate; pull_request
# triggers only on the census's own files to validate changes to it.
on:
  pull_request:
    paths:
      - 'tools/rc-native-census.sh'
      - '.github/workflows/rc-native-census.yml'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: rc-native-census-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rc-native-census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install toolchain (clang + libLLVM)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev
          LLVM_CONFIG="$(command -v llvm-config || ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LLVM_CONFIG" ]; then
            echo "::error::no llvm-config found after installing llvm-dev"; exit 1
          fi
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "using $LLVM_CONFIG ($($LLVM_CONFIG --version))"

      - name: "Build kaic2 (KAI_LLVM=1)"
        run: make -C stage2 CC=clang LLVM_CONFIG="$LLVM_CONFIG" KAI_LLVM=1 kaic2

      - name: "Run native RC census"
        run: ./tools/ci-bounded-step.sh 5400 "rc-native-census" ./tools/rc-native-census.sh
