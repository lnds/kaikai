name: diag-tcp
on:
  push:
    branches: [fix-tcp-concurrent-hang]
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: loop
        run: |
          sudo apt-get install -y gdb >/dev/null
          sudo sysctl kernel.yama.ptrace_scope=0
          nproc
          clang --version | head -1
          clang -std=c99 -O2 -Wno-unused-function -Wno-unused-variable -I stage2 -I stage0 diag/tc.c -o tc -lm -lpthread
          hangs=0
          for i in $(seq 1 3000); do
            ./tc > out.txt 2> err.txt &
            pid=$!
            n=0
            while kill -0 $pid 2>/dev/null && [ $n -lt 200 ]; do sleep 0.1; n=$((n+1)); done
            if kill -0 $pid 2>/dev/null; then
              hangs=$((hangs+1))
              echo "HANG run $i"
              for t in /proc/$pid/task/*; do echo "$t $(cat $t/wchan) $(grep State $t/status)"; done
              gdb -p $pid -batch -ex 'thread apply all bt' 2>&1 | tail -80
              ls -l /proc/$pid/fd
              kill -9 $pid
              [ $hangs -ge 3 ] && break
            fi
          done
          echo "hangs=$hangs"
