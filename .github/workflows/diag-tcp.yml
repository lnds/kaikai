name: diag-tcp
on:
  push:
    branches: [fix-tcp-concurrent-hang]
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cfg: ["4 4", "8 8", "8 2", "16 4"]
    steps:
      - uses: actions/checkout@v4
      - name: loop
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq gdb) >/dev/null 2>&1 || true
          sudo sysctl kernel.yama.ptrace_scope=0
          nproc
          clang --version | head -1
          clang -g -std=c99 -O2 -Wno-unused-function -Wno-unused-variable -I stage2 -I stage0 diag/tc.c -o tc -lm -lpthread
          set -- ${{ matrix.cfg }}
          for b in $(seq 1 $1); do (while :; do :; done) & done
          export KAI_THREADS=$2 KAI_TRACE_PARK=1
          hangs=0
          for i in $(seq 1 6000); do
            ./tc > out.txt 2> err.txt &
            pid=$!
            n=0
            while kill -0 $pid 2>/dev/null && [ $n -lt 400 ]; do sleep 0.05; n=$((n+1)); done
            if kill -0 $pid 2>/dev/null; then
              hangs=$((hangs+1))
              echo "HANG run $i"
              for t in /proc/$pid/task/*; do echo "$t $(cat $t/wchan) $(grep State $t/status)"; done
              gdb -p $pid -batch -ex 'set print pretty off' -ex 'p kai_reactor_parked_count' -ex 'p kai_blocked_fiber_count' -ex 'p kai_park_trace_seq' -ex 'p kai_reactor_socket_read_waiters' -ex 'p kai_reactor_socket_write_waiters' -ex 'p kai_sched_slots[0].steal_head' -ex 'p kai_sched_slots[1].steal_head' -ex 'p kai_sched_slots[2].steal_head' -ex 'p kai_sched_slots[3].steal_head' -ex 'p kai_sched_idle_count' -ex 'p kai_reactor_socket_read_waiters->reactor_wait_pid' -ex 'p kai_reactor_socket_read_waiters->reactor_next' -ex 'p kai_reactor_socket_write_waiters' 2>&1 | tail -30
              ss -tanp | grep -v LISTEN.*:22; ss -tlnp | head
              ls -l /proc/$pid/fd
              kill -9 $pid
              [ $hangs -ge 3 ] && break
            fi
          done
          echo "hangs=$hangs"
