name: diag-tcp
on:
  push:
    branches: [fix-tcp-concurrent-hang]
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cfg: ["4 4", "8 8", "16 4"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: loop
        run: |
          cc="clang -std=c99 -O2 -Wno-unused-function -Wno-unused-variable"
          mkdir old && git archive 13210ab38 stage2 stage0 | tar -x -C old
          $cc -I stage2 -I stage0 diag/fx.c -o fx_new -lm -lpthread
          $cc -I old/stage2 -I old/stage0 diag/fx.c -o fx_old -lm -lpthread
          $cc -I stage2 -I stage0 diag/tc.c -o tc_new -lm -lpthread
          $cc -I old/stage2 -I old/stage0 diag/tc.c -o tc_old -lm -lpthread
          set -- ${{ matrix.cfg }}
          for b in $(seq 1 $1); do (while :; do :; done) & done
          export KAI_THREADS=$2
          for bin in fx_old fx_new; do
            bad=0
            for i in $(seq 1 100); do
              timeout 30 ./$bin > /dev/null 2>&1 || bad=$((bad+1))
            done
            echo "RESULT $bin failures=$bad/100"
          done
          for bin in tc_old tc_new; do
            bad=0
            for i in $(seq 1 3000); do
              timeout 5 ./$bin > /dev/null 2>&1 || bad=$((bad+1))
            done
            echo "RESULT $bin failures=$bad/3000"
          done
