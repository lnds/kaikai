name: spike-windows

on:
  push:
    branches: [spike-windows]
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the released kai
        run: |
          curl -fsSL https://raw.githubusercontent.com/kaikailang-org/kaikai/main/install.sh | sh
          echo "$HOME/.kaikai/bin" >> "$GITHUB_PATH"
      - name: Emit each probe's C and the oracle's output
        run: |
          kai --version
          spike/windows/gen.sh "$RUNNER_TEMP/gen"
          mkdir -p "$RUNNER_TEMP/gen/src"
          cp -R spike "$RUNNER_TEMP/gen/src/"
          git archive HEAD stage0 | tar -x -C "$RUNNER_TEMP/gen/src"
      - uses: actions/upload-artifact@v4
        with:
          name: gen
          path: ${{ runner.temp }}/gen

  mingw:
    needs: gen
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: mingw-w64-clang-x86_64-clang make diffutils coreutils
      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: gen
      - name: Audit (clang, x86_64-w64-mingw32)
        run: bash gen/src/spike/windows/audit.sh "$PWD/gen" mingw clang 2>&1 | tee audit-mingw.txt
      - name: Stage 0 builds
        continue-on-error: true
        run: make -C gen/src/stage0 CC=clang 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-mingw
          path: |
            audit-mingw.txt
            report-mingw

  msvc:
    needs: gen
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: gen
      - name: Audit (clang, x86_64-pc-windows-msvc)
        run: |
          CLANG="/c/Program Files/LLVM/bin/clang.exe"
          "$CLANG" --version
          bash gen/src/spike/windows/audit.sh "$PWD/gen" msvc "$CLANG" --target=x86_64-pc-windows-msvc -D_CRT_SECURE_NO_WARNINGS 2>&1 | tee audit-msvc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-msvc
          path: |
            audit-msvc.txt
            report-msvc
