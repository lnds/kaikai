name: tier1-mn-corpus

# M:N corpus-determinism gate — the whole fixture corpus above one thread.
#
# The other M:N gates run ~9 hand-authored `mn_*` stress fixtures. None of
# them asks whether an ORDINARY program prints the same thing at N=4 that it
# prints at N=1, and while the KAI_THREADS default was 1, nothing else did
# either — so the only thing discovering M:N defects was the PR raising the
# default, and raising it was blocked on there being none. This gate breaks
# that loop: discovery runs on every PR, independent of the ship decision.
#
# Always-on, not path-gated: at KAI_THREADS>1 `main` itself becomes a fiber,
# so the allocator and scheduler paths change for EVERY program. The blast
# radius is not confined to the files a scheduler change touches, and a
# path filter would encode the opposite assumption.
#
# Two entry points, one set of jobs:
#  - PR / push / merge queue: tier1-native.yml calls this workflow with the
#    `kaic2-native` artifact it already built, and its own `tier1-mn-corpus`
#    job is the REQUIRED check aggregating the result. N=4, 2 repeats — the
#    cheapest sweep that still asks the question of every fixture on both
#    backends.
#  - Nightly cron and manual dispatch: this workflow builds its own native
#    kaic2 and sweeps N in {2,4,8} with 3 repeats, ~4.5x the runs, which does
#    not fit a PR. It rides here rather than in `make daily` because that
#    target has a 30-min budget it has already overrun once.
#
# The shard split is NOT written out here — it comes from
# tools/mn-corpus-shards.txt via tools/mn-corpus-plan.sh, which asserts the
# shards partition the corpus before a single fixture runs. A matrix written
# longhand drifts silently, and a coverage gate green over a shrunken corpus
# is worse than no gate.
on:
  workflow_call:
    inputs:
      artifact:
        description: Name of a native bootstrap-chain artifact from the calling run; empty builds one.
        type: string
        default: ''
  # Offset from daily.yml (02:00) and rc-detector.yml (02:30): the deep
  # sweep is measurement, and a co-scheduled cron competing for the runner
  # perturbs the timing it measures.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A wedged fixture must be counted as a hang, not absorbed into the job
  # ceiling where it reads as a cancelled run.
  MN_CORPUS_RUN_TIMEOUT: 30
  # The boot of stage2.c (docs/build-system.md §KAIC_BOOT). A caller's env
  # does not reach a called workflow, and a mode that disagrees with the
  # artifact's stage2.c.id rebuilds stage2.c.
  KAIC_BOOT: release

jobs:
  # Single source of truth for the shard split, asserted to partition the
  # corpus. A coverage drift fails fast and loud rather than producing a
  # green run over fewer fixtures.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: tools/mn-corpus-plan.sh

  # Scheduled and dispatched runs have no caller build to reuse. The gate
  # runs both the C and the native arm from the libLLVM kaic2: a C-only arm
  # misses native-only crashes.
  build-native:
    if: inputs.artifact == ''
    runs-on: ubuntu-latest
    # The same build as tier1-native's build-native: keep the ceilings equal.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (clang + libLLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev
          LLVM_CONFIG="$(command -v llvm-config || ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LLVM_CONFIG" ]; then
            echo "::error::no llvm-config found after installing llvm-dev"; exit 1
          fi
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
      # Same key as tier1-native's build. No restore-keys: a near-miss chain
      # plus the mtime touch would present a stale kaic2 as fresh.
      - name: Fingerprint toolchain for cache key
        id: cc-fp
        run: echo "id=$( (clang --version | head -1; "$LLVM_CONFIG" --version) | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      # The boot is part of the chain's identity: the key names the release it resolves to.
      - name: Resolve the release boot
        id: boot
        run: |
          id="$(tools/kaic-boot.sh release-id)"
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache native bootstrap chain (exact source match only)
        id: bootstrap-cache
        uses: actions/cache@v4
        with:
          path: |
            stage0/*.o
            stage0/kaic0
            stage1/kaic1
            stage1/build/stage1.c
            stage2/kaic2
            stage2/build/stage2.c
            stage2/build/stage2.c.id
            stage2/build/kaic2.id
            stage0/runtime_llvm.bc
            stage0/runtime_llvm.bc.stamp
            stage0/runtime_inline.bc
          key: kaic2-native-${{ steps.cc-fp.outputs.id }}-${{ steps.boot.outputs.id }}-${{ hashFiles('Makefile', 'EDITION', 'stage0/**', 'stage1/**', 'stage2/**', 'stdlib/**', 'tools/ci-touch-build.sh', 'tools/kaic-boot.sh', 'tools/assert-runtime-bc.sh') }}
      # kaic1 is not the boot; it ships because the consumers' chain carries it.
      - name: Build kaic1 and the release-booted native kaic2
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        run: |
          rm -f stage2/kaic2
          make kaic1
          make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" kaic2 > "$RUNNER_TEMP/kaic2.log" 2>&1 \
            || { tail -n 40 "$RUNNER_TEMP/kaic2.log"; exit 1; }
      - name: Mark cached chain fresh (no rebuild)
        if: steps.bootstrap-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaic2-mn-corpus
          path: |
            stage0/*.o
            stage0/kaic0
            stage1/kaic1
            stage1/build/stage1.c
            stage2/kaic2
            stage2/build/stage2.c
            stage2/build/stage2.c.id
            stage2/build/kaic2.id
            stage0/runtime_llvm.bc
            stage0/runtime_llvm.bc.stamp
            stage0/runtime_inline.bc
          retention-days: 1
          if-no-files-found: error

  mn-corpus-shard:
    needs: [plan, build-native]
    # build-native is skipped when a caller supplies the artifact.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build-native.result == 'success' || (inputs.artifact != '' && needs.build-native.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (clang + libLLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev
          LLVM_CONFIG="$(command -v llvm-config || ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)"
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact || 'kaic2-mn-corpus' }}
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      # Bounded below the job ceiling so a wedge fails as THIS step, named,
      # instead of burning the ceiling and reporting `cancelled` — which is
      # indistinguishable from a routine force-push supersede.
      - name: "M:N corpus determinism — ${{ matrix.name }} (both backends)"
        env:
          DEEP: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DEEP" = "true" ]; then
            export MN_CORPUS_THREADS="2 4 8" MN_CORPUS_REPEATS=3
            deadline=6600
          else
            export MN_CORPUS_THREADS=4 MN_CORPUS_REPEATS=2
            deadline=2100
          fi
          MN_CORPUS_DIRS="${{ matrix.dirs }}" \
            tools/ci-bounded-step.sh "$deadline" "mn-corpus/${{ matrix.name }}" \
            tools/run-mn-corpus-determinism.sh
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after mn-corpus/${{ matrix.name }}"; git status; exit 1
          fi
