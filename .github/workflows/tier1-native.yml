name: tier1-native

# tier1-native (KIR Lane 1.2, docs/kir-design.md §"Lane 1.2") gates the
# in-process libLLVM NATIVE backend (`kaic2 --emit=native`,
# docs/kir-design.md §7.2): it builds kaic2 with `KAI_LLVM=1`, then for
# every entry-point fixture emits a native object IN MEMORY via the LLVM C
# API, links it against the effects runtime, runs it, and diffs stdout +
# exit code against the C-direct backend (the oracle).
#
# Why this is an ALWAYS-ON PR gate (not path-gated): since the Lane 1.5 flip
# the in-process libLLVM native backend is the DEFAULT of `kai build` /
# `kai run`, so any change can regress it.
#
# Structure (docs/ci-time-analysis.md §7): a single `build-native` job
# builds the libLLVM kaic2 + P2 bitcode ONCE and publishes them; the corpus
# ratchet (~620 fixtures, the dominant cost) is sharded across three runners
# via $BACKEND_PARITY_DIRS (disjoint subsets whose union is the full corpus),
# and the native self-host gate runs as a fourth parallel consumer of the same
# artifact — nothing downstream depends on its output, so keeping it inside
# build-native would only delay the artifact upload (~13 min off the critical
# path). The M:N corpus gate and the RC detector consume the same artifact
# (see their jobs below). native is the DEFAULT backend and deserves equal-or-better coverage
# than the C oracle — sharding cuts wall-clock without dropping a fixture.
on:
  pull_request:
  # merge_group makes this required check run inside a GitHub merge queue
  # (harmless while the queue is not enabled in repo settings).
  merge_group:
  push:
    branches: [main]
    # Doc-only pushes and `cz bump` release commits change nothing this
    # gate tests (no status is required on main pushes); the PR side uses
    # the `changes` job instead because the required check must always
    # report a status.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'VERSION'
      - '.cz.toml'

# Cancel a superseded PR run; never cancel a main run — on main
# `github.ref` is constant, so superseding would kill the previous
# commit's verification, its only record of being tested (see tier1.yml).
concurrency:
  group: tier1-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The boot of stage2.c (docs/build-system.md §KAIC_BOOT). Workflow-wide: a
# job whose mode disagrees with the artifact's stage2.c.id rebuilds stage2.c.
env:
  KAIC_BOOT: release

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      doc-only: ${{ steps.doc-only.outputs.skip }}
      nscol: ${{ steps.nscol.outputs.run }}
      rcdet: ${{ steps.rcdet.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect doc-only diff
        id: doc-only
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ -z "$CHANGED" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NON_DOC=$(echo "$CHANGED" | grep -Ev '^(docs/|[^/]+\.md$|LICENSE$)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Doc-only PR; skipping tier1-native."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The namespace-collision corpus builds, links and RUNS every fixture on
      # the native backend. It proves homonymous
      # names across modules, effects, types and constructors still resolve, so
      # a diff that cannot reach name resolution cannot break it. Gated on the
      # paths that can, the way rc-detector gates its own corpus. `stdlib/` is
      # in the list because a new stdlib name can contest a user's, and
      # `runtime.h` because effect dispatch resolves by bare name there.
      - name: Does this diff reach name resolution?
        id: nscol
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          if echo "$CHANGED" | grep -qE '^stage2/compiler/(resolve|name_|scope|sym|qual|modules|import|decl_names|fnreg|proto|effect_scope|type_scope|infer_name|infer_type_coll|kind_resolve|cache_module|closure_spec|emit_shared|emit_c|emit_native|kir_lower)|^stage2/compiler/(infer|parse|monomorph|driver)\.kai$|^examples/namespace-collisions/|^tests/namespace_matrix|^tools/nscol-|^tools/baselines/nscol/|^stage2/runtime\.h$|^stage2/Makefile$|^\.github/workflows/tier1-native\.yml$|^stdlib/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Diff does not reach name resolution; skipping the namespace-collision corpus."
          fi

      # The RC detector runs only on PRs that can introduce an RC regression;
      # its daily cron lives in rc-detector.yml.
      - name: Does this diff reach the RC surface?
        id: rcdet
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          if echo "$CHANGED" | grep -qE '^(stage0/runtime\.h|stage0/runtime_llvm\.c|stage2/compiler/perceus\.kai|stage2/compiler/emit_c\.kai|stage2/compiler/kir_lower_[^/]*\.kai|stage2/compiler/emit_native[^/]*\.kai|examples/perceus/.*|tools/rc-selfhost-detector\.sh|tools/rc-detector-corpus\.txt|tools/kaic2-native-capable\.sh|\.github/workflows/(rc-detector|tier1-native)\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Diff does not reach the RC surface; skipping the RC detector."
          fi

  # Build the libLLVM-capable kaic2 + P2 runtime bitcode once, assert P2 is
  # active (clang 18 — a dropped clang 18 is a red build, not a silent perf
  # regression), and publish for the shards. Both shards run on identical
  # ubuntu-latest with the same apt llvm-dev, so the dynamically-linked
  # libLLVM kaic2 is ABI-compatible across them.
  build-native:
    needs: changes
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    # A release boot compiles the whole compiler twice; keep equal to
    # tier1-mn-corpus's scheduled build-native.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (clang + libLLVM)
        run: ./tools/ci-install-toolchain.sh llvm
      # Exact-match cache of the native bootstrap chain (same discipline as
      # tier1's build job: no restore-keys — a near-miss chain plus the mtime
      # touch would present a stale kaic2 as fresh). The key folds the clang
      # AND libLLVM identities so a runner-image LLVM bump misses cleanly.
      - name: Fingerprint toolchain for cache key
        id: cc-fp
        run: echo "id=$( (clang --version | head -1; "$LLVM_CONFIG" --version) | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      # The boot is part of the chain's identity: the key names the release it resolves to.
      - name: Resolve the release boot
        id: boot
        run: |
          id="$(tools/kaic-boot.sh release-id)"
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache native bootstrap chain (exact source match only)
        id: bootstrap-cache
        uses: actions/cache@v4
        with:
          path: |
            stage0/*.o
            stage0/kaic0
            stage1/kaic1
            stage1/build/stage1.c
            stage2/kaic2
            stage2/build/stage2.c
            stage2/build/stage2.c.id
            stage2/build/kaic2.id
            stage0/runtime_llvm.bc
            stage0/runtime_llvm.bc.stamp
            stage0/runtime_inline.bc
          key: kaic2-native-${{ steps.cc-fp.outputs.id }}-${{ steps.boot.outputs.id }}-${{ hashFiles('Makefile', 'EDITION', 'stage0/**', 'stage1/**', 'stage2/**', 'stdlib/**', 'tools/ci-touch-build.sh', 'tools/kaic-boot.sh', 'tools/kaic-link.sh', 'tools/assert-runtime-bc.sh') }}
      # Both hops are linked from one translation unit per module, compiled on
      # every core (tools/kaic-link.sh). Each object is keyed by everything
      # cc reads for it, so a near-miss restore is sound here: an object whose
      # inputs changed is not found, and is compiled. Saved from main only: a
      # PR restores main's objects and compiles the modules it touches.
      - name: Restore boot objects
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: stage2/build/obj-cache
          key: kaic2-native-obj-${{ steps.cc-fp.outputs.id }}-${{ github.sha }}
          restore-keys: |
            kaic2-native-obj-${{ steps.cc-fp.outputs.id }}-
      # kaic1 is not the boot; it ships because the consumers' chain carries it.
      # The log is shown only on failure, bar the lines that time each hop.
      - name: Build kaic1 and the release-booted native kaic2
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        env:
          KAIC_BOOT_MODULAR: 1
        run: |
          set -o pipefail
          rm -f stage2/kaic2
          make kaic1
          make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" kaic2 2>&1 \
            | tee "$RUNNER_TEMP/kaic2.log" | grep --line-buffered -E '^(kaic-boot|kaic-link|building stage2):' \
            || { tail -n 40 "$RUNNER_TEMP/kaic2.log"; exit 1; }
      - name: Save boot objects
        if: steps.bootstrap-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: stage2/build/obj-cache
          key: kaic2-native-obj-${{ steps.cc-fp.outputs.id }}-${{ github.sha }}
      - name: Mark cached chain fresh (no rebuild)
        if: steps.bootstrap-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: Assert P2 bitcode
        run: tools/assert-runtime-bc.sh
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaic2-native
          path: |
            stage0/*.o
            stage0/kaic0
            stage1/kaic1
            stage1/build/stage1.c
            stage2/kaic2
            stage2/build/stage2.c
            stage2/build/stage2.c.id
            stage2/build/kaic2.id
            stage0/runtime_llvm.bc
            stage0/runtime_llvm.bc.stamp
            stage0/runtime_inline.bc
          retention-days: 1
          if-no-files-found: error

  # Native self-host gate: compile the compiler itself with the native
  # backend and ratchet the `unbound register` subset-gap count against
  # tools/native-selfhost-baseline.txt — green at baseline, red only on
  # regression (count rises). Also asserts byte-identical C for a
  # Layout-bearing program. Native-only — does not touch the C bootstrap.
  # Runs parallel to the shards on the shared artifact: nothing consumes its
  # output, and the aggregator (a Required check) gates on it. The gate
  # script runs the artifact's kaic2 as published — build-native already
  # linked it against libLLVM — and probes that binary for the native
  # backend before self-compiling.
  native-selfhost-gate:
    needs: [changes, build-native]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (clang + libLLVM)
        run: ./tools/ci-install-toolchain.sh llvm
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-native
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: "Native self-host gate (ratchet — fails only on regression)"
        run: CC=clang LLVM_CONFIG="$LLVM_CONFIG" tools/test-native-selfhost-gate.sh
      # The second half of the native leak ledger; native-rc-leak-gate runs
      # the first. Both halves run wherever this workflow runs.
      - name: "Perceus RC leak ledger, native column, second half (tools/baselines/rc-leak/)"
        run: |
          set -o pipefail
          command -v "$LLVM_CONFIG" >/dev/null || { echo "::error::LLVM_CONFIG does not resolve; the native leak gate would skip"; exit 1; }
          KAI_LEAK_SHARD=2/2 ./tools/ci-bounded-step.sh 1800 "rc-leak-gate (native)" make -C stage2 CC=clang KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" rc-leak-gate-native 2>&1 | tee "$RUNNER_TEMP/rc-leak-native.log"
          grep -q '^rc-leak-gate: PASS — [1-9]' "$RUNNER_TEMP/rc-leak-native.log" || { echo "::error::the native leak gate reported no PASS; nothing was measured"; exit 1; }
      # A job killed for memory keeps no log, so the sample series the gate
      # writes is the only record of how the self-compile died.
      - name: Memory samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-memory-samples
          path: selfhost-memory-samples.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: Working tree clean check
        run: |
          rm -f selfhost-memory-samples.txt
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after native-selfhost-gate"; git status; exit 1
          fi

  # Shard 1 — effects corpus subset, its single-fixture gates, and the
  # targets that drive bin/kai with KAI_BACKEND=native.
  native-shard-1:
    needs: [changes, build-native]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (clang + libLLVM)
        run: ./tools/ci-install-toolchain.sh llvm
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-native
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: "Ratchet shard 1 (effects vs C-direct)"
        run: |
          CC=clang LLVM_CONFIG="$LLVM_CONFIG" \
            TARGET_BACKEND=native ORACLE_BACKEND=c NATIVE_PARITY_RATCHET=1 \
            BACKEND_PARITY_DIRS="examples/effects" \
            tools/test-backend-parity.sh
      - name: "Single-fixture native gates (stage2/test-lists/native-gates-1.txt, under make -j)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-native-gates-1
      - name: "tier1-native #1341 user + core cache fixtures engage on the native driver paths (KAI_CACHE=1 writes blobs)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-user-cache test-core-cache
      - name: "tier1-native #1234 M:N work-steal soundness (native cross-thread stress, KAI_THREADS=4/8, zero crashes)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-mn-native-soundness
      - name: "tier1-native #1238 M:N C-backend soundness under clang (kai single-TU + modular + ownerless -O2 cross-thread stress, KAI_THREADS=4/8, zero crashes)"
        run: CC=clang make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-mn-c-clang-soundness
      - name: "Targets that drive bin/kai with KAI_BACKEND=native"
        if: ${{ !cancelled() }}
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-native-wrapper
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after native-shard-1"; git status; exit 1
          fi

  # Shard 1b — the rest of the former shard-1 subset, split out so the
  # two ratchets run in parallel (~230 vs ~216 fixtures), plus the native
  # and neg-native axes of the namespace-collision corpus (fanned out over
  # the runner's cores). The native-modular axis rides native-rc-leak-gate.
  native-shard-1b:
    needs: [changes, build-native]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (clang + libLLVM)
        run: ./tools/ci-install-toolchain.sh llvm
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-native
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: "Ratchet shard 1b (perceus/refinements/actors/llvm/spawn vs C-direct)"
        run: |
          CC=clang LLVM_CONFIG="$LLVM_CONFIG" \
            TARGET_BACKEND=native ORACLE_BACKEND=c NATIVE_PARITY_RATCHET=1 \
            BACKEND_PARITY_DIRS="examples/perceus examples/refinements examples/actors examples/llvm examples/spawn" \
            tools/test-backend-parity.sh
      - name: "tier1-native namespace-collision corpus, native axis (ratchet: tools/baselines/nscol/)"
        if: needs.changes.outputs.nscol == 'true'
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-namespace-collisions-native
      - name: "tier1-native namespace-collision corpus, neg-native axis (ratchet: tools/baselines/nscol/)"
        if: ${{ !cancelled() && needs.changes.outputs.nscol == 'true' }}
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-namespace-collisions-neg-native
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after native-shard-1b"; git status; exit 1
          fi

  # Shard 2 — remaining corpus subset and the single-fixture native gates
  # (one `make -j` over stage2/test-lists/native-gates-2.txt).
  native-shard-2:
    needs: [changes, build-native]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (clang + libLLVM)
        run: ./tools/ci-install-toolchain.sh llvm
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-native
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: "HTTP redirect credentials on the wire (native)"
        run: make test-http-redirects KAI_TEST_BACKEND=native
      - name: "Native diagnostics name the user's source, from a path full of metacharacters"
        run: tests/native_diag_path.sh
      - name: "Native module objects are identical for any KAI_NATIVE_JOBS"
        run: tests/native_emit_jobs.sh
      - name: "A broken imported module fails the build on every build path"
        run: tests/broken_import_paths.sh
      - name: "Ratchet shard 2 (packages/minimal/quickstart/stdlib/attributes/unstable/demos vs C-direct)"
        run: |
          CC=clang LLVM_CONFIG="$LLVM_CONFIG" \
            TARGET_BACKEND=native ORACLE_BACKEND=c NATIVE_PARITY_RATCHET=1 \
            BACKEND_PARITY_DIRS="examples/packages examples/minimal examples/quickstart examples/stdlib examples/attributes examples/unstable demos" \
            tools/test-backend-parity.sh
      - name: "Single-fixture native gates (stage2/test-lists/native-gates-2.txt, under make -j)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-native-gates-2
      # These hide the runtime bitcode in stage0/ while they run, so they
      # stay out of the parallel gate list.
      - name: "tier1-native #1641 core-object key folds the runtime-bitcode state (warm cache + hidden bitcodes still links)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-native-core-obj-bc-state
      - name: "tier1-native #747 variant Real-slot UAF (ASAN clean + parity)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-perceus-747-native-real-slot-uaf
      - name: "tier1-native #1636 nested-rotation reuse (ASAN + no cell pool, clean + parity)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-perceus-nested-reuse-asan-native
      - name: "tier1-native monitor ref owns its pid reference (ASAN + no cell pool, clean + parity)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-monitor-ref-asan-native
      - name: "tier1-native Perceus use-after-free fixtures (ASAN + no cell pool)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-perceus-asan-native
      - name: "tier1-native trap landing pads release each frame's references (ASAN + LeakSanitizer)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-trap-pads-asan-native
      - name: "tier1-native declared core builtins own their args and result (ASAN + LeakSanitizer)"
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-kai-builtins-asan-native
      - name: "tier1-native reference-count budget (native counts; seeds its baseline when absent)"
        run: RC_BUDGET_BACKEND=native tools/rc-budget-gate.sh
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after native-shard-2"; git status; exit 1
          fi

  # M:N corpus determinism on the shared native build. The shards live in
  # tier1-mn-corpus.yml, which also carries the nightly deep sweep; the
  # REQUIRED `tier1-mn-corpus` check is the aggregator below, because a
  # called workflow's jobs report under a `caller / job` name.
  mn-corpus:
    needs: [changes, build-native]
    if: needs.changes.outputs.doc-only != 'true'
    uses: ./.github/workflows/tier1-mn-corpus.yml
    with:
      artifact: kaic2-native

  # Aggregator. Green iff the coverage plan held and every shard passed; a
  # doc-only PR reports SUCCESS without running them.
  tier1-mn-corpus:
    needs: [changes, mn-corpus]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on the plan and all shards
        run: |
          if [ "${{ needs.changes.outputs.doc-only }}" = "true" ]; then
            echo "tier1-mn-corpus OK — doc-only PR, shards skipped"; exit 0
          fi
          r='${{ needs.mn-corpus.result }}'
          echo "mn-corpus: $r"
          if [ "$r" = "success" ]; then
            echo "tier1-mn-corpus OK — the corpus reproduces its N=1 behaviour at N=4 on both backends"
          else
            echo "::error::tier1-mn-corpus FAIL — the coverage plan or a shard did not succeed"; exit 1
          fi

  # The Perceus leak ledger's native column, on the shared native build.
  # tier1 checks the C column; this job is the only one that reads the other.
  # It also carries the curated smoke (examples/native, a separate corpus
  # from the ratchet dirs): the ledger alone leaves most of a runner idle.
  native-rc-leak-gate:
    needs: [changes, build-native]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain (clang + libLLVM)
        run: ./tools/ci-install-toolchain.sh llvm
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-native
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      # The make target skips with status 0 when libLLVM is missing; here a
      # skip must fail, so the step requires the gate's own PASS line over a non-empty corpus.
      - name: "Perceus RC leak ledger, native column, first half (tools/baselines/rc-leak/)"
        run: |
          set -o pipefail
          command -v "$LLVM_CONFIG" >/dev/null || { echo "::error::LLVM_CONFIG does not resolve; the native leak gate would skip"; exit 1; }
          KAI_LEAK_SHARD=1/2 ./tools/ci-bounded-step.sh 1800 "rc-leak-gate (native)" make -C stage2 CC=clang KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" rc-leak-gate-native 2>&1 | tee "$RUNNER_TEMP/rc-leak-native.log"
          grep -q '^rc-leak-gate: PASS — [1-9]' "$RUNNER_TEMP/rc-leak-native.log" || { echo "::error::the native leak gate reported no PASS; nothing was measured"; exit 1; }
      - name: "Smoke: every examples/native fixture (emit -> link -> run -> diff)"
        run: CC=clang LLVM_CONFIG="$LLVM_CONFIG" tools/test-native-parity.sh
      - name: "Effects goldens (native stdout vs .out.expected — parity is blind to shared drift)"
        run: |
          CC=clang LLVM_CONFIG="$LLVM_CONFIG" \
            TARGET_BACKEND=native tools/test-effects-goldens.sh
      - name: "tier1-native namespace-collision corpus, native-modular axis (ratchet: tools/baselines/nscol/)"
        if: ${{ !cancelled() && needs.changes.outputs.nscol == 'true' }}
        run: make -C stage2 KAI_LLVM=1 LLVM_CONFIG="$LLVM_CONFIG" test-namespace-collisions-native-modular
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after native-rc-leak-gate"; git status; exit 1
          fi

  # RC self-host detector on the shared native build, path-gated; the
  # `tier1-native` aggregator gates on it when it runs. Its daily cron
  # lives in rc-detector.yml.
  rc-detector:
    needs: [changes, build-native]
    if: needs.changes.outputs.doc-only != 'true' && needs.changes.outputs.rcdet == 'true'
    uses: ./.github/workflows/rc-detector.yml
    with:
      artifact: kaic2-native

  # Aggregator (mirrors tier1's). This is the Required check branch
  # protection gates on: one tidy `tier1-native` status, green iff all
  # shards, the self-host gate, the native RC leak ledger and, when the diff
  # reaches its paths, the RC detector pass.
  tier1-native:
    needs: [changes, native-shard-1, native-shard-1b, native-shard-2, native-selfhost-gate, native-rc-leak-gate, rc-detector]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on all native shards + self-host gate
        run: |
          if [ "${{ needs.changes.outputs.doc-only }}" = "true" ]; then
            echo "tier1-native OK — doc-only PR, shards skipped"; exit 0
          fi
          r1='${{ needs.native-shard-1.result }}'
          r1b='${{ needs.native-shard-1b.result }}'
          r2='${{ needs.native-shard-2.result }}'
          r3='${{ needs.native-selfhost-gate.result }}'
          r4='${{ needs.native-rc-leak-gate.result }}'
          r5='${{ needs.rc-detector.result }}'
          rcdet='${{ needs.changes.outputs.rcdet }}'
          echo "native results: shard1=$r1 shard1b=$r1b shard2=$r2 selfhost-gate=$r3 rc-leak-gate=$r4 rc-detector=$r5 (in scope: $rcdet)"
          if [ "$r1" = "success" ] && [ "$r1b" = "success" ] && [ "$r2" = "success" ] && [ "$r3" = "success" ] && [ "$r4" = "success" ]; then
            :
          else
            echo "::error::tier1-native FAIL — a shard, the self-host gate or the native RC leak ledger did not succeed"; exit 1
          fi
          if [ "$rcdet" = "true" ] && [ "$r5" != "success" ]; then
            echo "::error::tier1-native FAIL — the RC detector did not succeed"; exit 1
          fi
          echo "tier1-native OK — all three shards + self-host gate + native RC leak ledger (+ RC detector when in scope) green"
