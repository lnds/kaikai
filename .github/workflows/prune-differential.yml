name: prune-differential

# Every example and every pair of demand routes compiled and run with the
# core pruned and against the whole core (KAI_CORE_PRUNE=off), on both
# backends (docs/build-system.md §The pruning differential). Diagnostic: a
# nightly cron plus dispatch, not a per-PR gate; pull_request triggers only
# on the harness's own files to validate changes to it.
on:
  pull_request:
    paths:
      - 'tools/prune-differential.sh'
      - 'tools/prune-combos.sh'
      - 'tools/prune-differential-skips.txt'
      - '.github/workflows/prune-differential.yml'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: prune-differential-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KAIC_BOOT: release

jobs:
  prune-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { set: combos, backend: c, shard: "1/1" }
          - { set: combos, backend: native, shard: "1/1" }
          - { set: corpus, backend: c, shard: "1/4" }
          - { set: corpus, backend: c, shard: "2/4" }
          - { set: corpus, backend: c, shard: "3/4" }
          - { set: corpus, backend: c, shard: "4/4" }
          - { set: corpus, backend: native, shard: "1/4" }
          - { set: corpus, backend: native, shard: "2/4" }
          - { set: corpus, backend: native, shard: "3/4" }
          - { set: corpus, backend: native, shard: "4/4" }
    name: prune-differential (${{ matrix.set }} ${{ matrix.backend }} ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install toolchain (clang + libLLVM)"
        run: ./tools/ci-install-toolchain.sh llvm

      - name: "Build kaic2 (KAI_LLVM=1) and bin/kai"
        run: |
          make -C stage2 CC=clang LLVM_CONFIG="$LLVM_CONFIG" KAI_LLVM=1 kaic2
          make -s -C tools/kai kai

      - name: "Run the pruning differential"
        run: ./tools/ci-bounded-step.sh 5400 "prune-differential" bash -c './tools/prune-differential.sh --backend ${{ matrix.backend }} --shard ${{ matrix.shard }} ${{ matrix.set }} 2>&1 | tee prune-differential.log; exit ${PIPESTATUS[0]}'

      - name: "Upload the report"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: prune-differential-report-${{ matrix.set }}-${{ matrix.backend }}-${{ strategy.job-index }}
          path: prune-differential.log
          if-no-files-found: ignore
