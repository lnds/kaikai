# Grades the code health with Kimün on every push to main and publishes
# the badge on GitHub Pages, so the one in the README never goes stale
# and nothing has to be committed back to the branch.
name: km score

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: lnds/kimun-action@v1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: km-badge
      - id: deploy
        uses: actions/deploy-pages@v4
