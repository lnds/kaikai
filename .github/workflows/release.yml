name: release

# Triggered by version tag pushes (`v*`) — produces a GitHub Release with
# platform-specific tarballs as assets. Manual dispatch is also allowed
# for re-running against an existing tag if a build needs to be redone,
# or, with mirror_seed_only, for copying an already published seed tag to
# the public mirror and nothing else, or, with seed_run_id, for publishing
# the seed and the mirror from an earlier run's artifacts without rebuilding.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.39.0)"
        required: true
        type: string
      mirror_seed_only:
        description: "Only copy the tag's bootstrap seed to kaikailang-org/kaikai"
        required: false
        type: boolean
        default: false
      seed_run_id:
        description: "Publish the seed and the mirror from this earlier run's seed artifacts (no build, no release)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            os_name: darwin
            arch: arm64
          - os: ubuntu-24.04
            os_name: linux
            arch: x86_64
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.mirror_seed_only && !inputs.seed_run_id }}
    # The shipped kaic2 links libLLVM IN so `kai build` runs the native
    # default with no system LLVM. The archives normally arrive prebuilt;
    # 90 min leaves headroom for the source build a configuration with no
    # published asset falls back to.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Read version
        id: meta
        run: |
          ver="$(cat VERSION)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          tag="${{ steps.tag.outputs.tag }}"
          if [ "v$ver" != "$tag" ]; then
            echo "::error::tag $tag does not match VERSION $ver"
            exit 1
          fi

      # The vendored static libLLVM comes prebuilt, per platform, from the
      # llvm-static-* release that llvm-prebuilt.yml publishes. Exit 3 means
      # nothing is published for this configuration: the archives are then
      # compiled here, which is the only case that needs cmake + ninja.
      # Neither is a stage 0 dep — the bootstrap stays cc-only.
      #
      # The tree is the tag's, not this workflow's. A tag without the script
      # has a build-release.sh that compiles libLLVM itself, so it takes the
      # source-build path too.
      - name: Fetch prebuilt static libLLVM
        id: llvm
        run: |
          rc=3
          if [ -x scripts/llvm-prebuilt.sh ]; then
            rc=0
            ./scripts/llvm-prebuilt.sh fetch || rc=$?
          fi
          case "$rc" in
            0) echo "source_build=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "::warning::no prebuilt static libLLVM for this configuration; compiling it from source"
               echo "source_build=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Install cmake + ninja (libLLVM source build) [macOS]
        if: steps.llvm.outputs.source_build == 'true' && runner.os == 'macOS'
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            brew install cmake ninja
          fi
          cmake --version
          ninja --version

      - name: Install cmake + ninja (libLLVM source build) [Linux]
        if: steps.llvm.outputs.source_build == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          cmake --version
          ninja --version

      # P2 (docs/native-codegen-perf-plan.md §P2): clang 18 generates the
      # native-runtime bitcode the release ships. It MUST match the vendored
      # libLLVM 18 (writer <= reader); the vendored LLVM build is libs-only
      # (LLVM_ENABLE_PROJECTS=""), so a clang 18 is installed separately here.
      # build-release.sh asserts the bitcode turned active, so a missing
      # clang 18 fails the release loudly rather than shipping the slow path.
      - name: Install clang 18 (native P2 runtime bitcode) [macOS]
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          echo "/opt/homebrew/opt/llvm@18/bin" >> "$GITHUB_PATH"
          /opt/homebrew/opt/llvm@18/bin/clang --version

      # gen-runtime-bc.sh resolves `clang-18` from PATH and
      # /usr/lib/llvm-18/bin/clang — both provided by the clang-18 package.
      # llvm-18-tools carries the version-locked llvm-nm-18 the tls-hoist
      # gate needs. Neither is a stage 0 dep; the bootstrap stays cc-only.
      - name: Install clang 18 (native P2 runtime bitcode) [Linux]
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18-tools
          clang-18 --version

      - name: Build release tarball
        run: ./scripts/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-v${{ steps.meta.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            dist/kaikai-v${{ steps.meta.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz
            dist/kaikai-v${{ steps.meta.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload bootstrap seed
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-seed-v${{ steps.meta.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/bootstrap-seed-v${{ steps.meta.outputs.version }}/bootstrap/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Only the manifest generator is needed here; a full checkout would
      # pull the whole tree to run one shell script.
      - name: Checkout the manifest generator
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          sparse-checkout: scripts/gen-latest-json.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Tarballs only: the seed artifacts are published by the seed job.
      - name: Download the tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: kaikai-v*
          path: dist
          merge-multiple: true

      # The manifest ships as a release asset, so it is generated from the
      # same dist/ that is about to be uploaded and lands in the same
      # `gh release` call. A platform whose build failed is absent from
      # both, so the manifest can never advertise a missing tarball.
      - name: Generate latest.json
        run: |
          ./scripts/gen-latest-json.sh "${{ steps.tag.outputs.tag }}" dist dist/latest.json

      - name: List artifacts
        run: ls -lh dist/

      - name: Create or update release
        env:
          # The release lives on kaikailang-org/kaikai (public mirror), which
          # the default GITHUB_TOKEN cannot reach from this work-repo workflow
          # (403 "Resource not accessible by integration"). TAP_PAT has
          # cross-repo scope across the kaikailang-org/* family.
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # If a release already exists for this tag (e.g. when re-running via
          # workflow_dispatch), upload assets to it; otherwise create a new
          # release with auto-generated notes.
          if gh release view "$tag" --repo kaikailang-org/kaikai >/dev/null 2>&1; then
            echo "release $tag exists; uploading new assets with --clobber"
            gh release upload "$tag" --repo kaikailang-org/kaikai --clobber dist/*
          else
            echo "creating release $tag"
            gh release create "$tag" --repo kaikailang-org/kaikai \
              --title "kaikai $tag" \
              --generate-notes \
              dist/*
          fi

  # The seed the next release boots from, as a tag on a commit whose parent is
  # this release. Every platform emits it and they must agree byte for byte;
  # the tag is created once and never moved.
  seed:
    name: Publish bootstrap seed
    needs: build
    if: ${{ !cancelled() && !inputs.mirror_seed_only && (needs.build.result == 'success' || inputs.seed_run_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Download the seeds
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-seed-*
          path: seeds
          run-id: ${{ inputs.seed_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Require one seed across platforms
        run: |
          set -eu
          first=""
          for d in seeds/*; do
            [ -n "$first" ] || { first="$d"; continue; }
            for f in stage2.c runtime.h; do
              cmp -s "$first/$f" "$d/$f" && continue
              echo "::error::$f differs between $(basename "$first") and $(basename "$d"): stage 2 emits platform-dependent C for its own source. No seed is published."
              sha256sum "$first/$f" "$d/$f"
              diff "$first/$f" "$d/$f" | head -n 60 || true
              exit 1
            done
          done
          [ -n "$first" ] || { echo "::error::no seed artifact"; exit 1; }
          echo "SEED_SRC=$first" >> "$GITHUB_ENV"

      # GitHub checks a new tag's tree against the default branch, so once a
      # workflow changes on main after the release, GITHUB_TOKEN (which can
      # never carry the workflows permission) is refused the seed tag. Only
      # that refusal falls back to SEED_PUSH_TOKEN.
      - name: Tag the seed
        env:
          SEED_PUSH_TOKEN: ${{ secrets.SEED_PUSH_TOKEN }}
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          seed="bootstrap-seed-$tag"
          c_sha="$(sha256sum "$SEED_SRC/stage2.c" | cut -d' ' -f1)"
          h_sha="$(sha256sum "$SEED_SRC/runtime.h" | cut -d' ' -f1)"
          if git ls-remote --exit-code --tags origin "refs/tags/$seed" >/dev/null; then
            git fetch --depth=1 origin "refs/tags/$seed:refs/tags/$seed"
            if git show "$seed:bootstrap/stage2.c" | cmp -s - "$SEED_SRC/stage2.c" \
               && git show "$seed:bootstrap/runtime.h" | cmp -s - "$SEED_SRC/runtime.h"; then
              echo "$seed is already published with this seed"
              exit 0
            fi
            echo "::error::$seed is already published with a different seed; a seed tag is never moved"
            exit 1
          fi
          mkdir bootstrap
          cp "$SEED_SRC/stage2.c" "$SEED_SRC/runtime.h" bootstrap/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap
          git commit -q -F - <<EOF
          build(bootstrap): freeze the stage2.c rescue seed for $tag

          The parent is $tag. bootstrap/stage2.c is the C the parent's kaic2
          emits for its own source, byte-identical on every release platform.
          bootstrap/runtime.h is the parent's stage2/runtime.h, the only project
          header that C includes.

          sha256 bootstrap/stage2.c $c_sha
          sha256 bootstrap/runtime.h $h_sha
          EOF
          git tag -a "$seed" -m "Bootstrap rescue seed emitted by $tag" -m "sha256 bootstrap/stage2.c $c_sha"
          if git push origin "refs/tags/$seed" 2> push.err; then
            exit 0
          fi
          cat push.err
          if ! grep -q "without .workflows. permission" push.err; then
            exit 1
          fi
          token="$(printf '%s' "${SEED_PUSH_TOKEN:-}" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::a workflow changed on main after $tag, so GITHUB_TOKEN may not create $seed; secrets.SEED_PUSH_TOKEN (Contents and Workflows write on ${GITHUB_REPOSITORY}) is needed and not set"
            exit 1
          fi
          # Never prints the token: only its shape and what the API answers.
          case "$token" in github_pat_*) kind=fine-grained ;; ghp_*) kind=classic ;; *) kind=unrecognised ;; esac
          stripped=$(( ${#SEED_PUSH_TOKEN} - ${#token} ))
          user_status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" https://api.github.com/user)"
          repo_status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          echo "SEED_PUSH_TOKEN: $kind, ${#token} chars, $stripped whitespace chars stripped, GET /user $user_status, GET /repos/${GITHUB_REPOSITORY} $repo_status"
          basic="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "::add-mask::$basic"
          # An empty extraheader drops the checkout's GITHUB_TOKEN header
          # before the token's own is added.
          git -c "http.https://github.com/.extraheader=" \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
              push origin "refs/tags/$seed"

  update-tap:
    name: Update Homebrew tap formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download sha256 from release
        env:
          # Use TAP_PAT for cross-repo gh API consistency with the release job.
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="${{ steps.tag.outputs.version }}"
          asset="kaikai-v${version}-darwin-arm64.tar.gz.sha256"
          gh release download "$tag" --repo kaikailang-org/kaikai \
            --pattern "$asset" --dir /tmp/release-assets
          # File format: "<sha256>  <filename>"
          sha=$(awk '{print $1}' "/tmp/release-assets/$asset")
          if [ -z "$sha" ] || [ ${#sha} -ne 64 ]; then
            echo "::error::invalid sha256 in $asset: '$sha'"
            exit 1
          fi
          echo "sha256=$sha" >> "$GITHUB_ENV"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: kaikailang-org/homebrew-kaikai
          token: ${{ secrets.TAP_PAT }}
          path: tap

      - name: Patch Formula/kaikai.rb
        run: |
          version="${{ steps.tag.outputs.version }}"
          tag="${{ steps.tag.outputs.tag }}"
          sha="$sha256"
          formula="tap/Formula/kaikai.rb"
          # version "X.Y.Z"
          sed -i -E "s|^(  version )\"[0-9.]+\"|\1\"${version}\"|" "$formula"
          # url "https://github.com/lnds/kaikai/releases/download/vX.Y.Z/kaikai-vX.Y.Z-...
          sed -i -E "s|/releases/download/v[0-9.]+/kaikai-v[0-9.]+-|/releases/download/${tag}/kaikai-${tag}-|g" "$formula"
          # sha256 "..."
          sed -i -E "s|sha256 \"[0-9a-f]{64}\"|sha256 \"${sha}\"|" "$formula"
          echo "--- patched formula ---"
          grep -E "version |url |sha256 " "$formula"

      - name: Commit and push to tap
        run: |
          version="${{ steps.tag.outputs.version }}"
          cd tap
          if git diff --quiet; then
            echo "no changes to formula; skipping commit"
            exit 0
          fi
          git config user.name "kaikai-release-bot"
          git config user.email "kaikai-release-bot@users.noreply.github.com"
          git add Formula/kaikai.rb
          git commit -m "chore(formula): bump to v${version}"
          git push origin HEAD

  # The seed tag goes to the mirror too, on top of the mirror's snapshot of
  # the release, so a mirror clone can boot with cc alone.
  publish-source:
    name: Mirror filtered source to kaikailang-org/kaikai
    needs: [release, seed]
    if: ${{ !cancelled() && (inputs.mirror_seed_only || (needs.seed.result == 'success' && (needs.release.result == 'success' || inputs.seed_run_id))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout work repo at tag (no persisted creds)
        if: ${{ !inputs.mirror_seed_only }}
        # persist-credentials: false is load-bearing. With the default
        # (true), actions/checkout installs http.extraheader with the
        # ephemeral GITHUB_TOKEN. That header applies to every push to
        # github.com — including push to the public mirror — and
        # overrides the PAT embedded in the remote URL, producing a
        # 403 "denied to github-actions[bot]" that broke this job for
        # 8 consecutive releases (v0.63.0 → v0.68.1).
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Verify VERSION matches tag
        if: ${{ !inputs.mirror_seed_only }}
        run: |
          ver="$(cat VERSION)"
          tag="${{ steps.tag.outputs.tag }}"
          if [ "v$ver" != "$tag" ]; then
            echo "::error::tag $tag does not match VERSION $ver"
            exit 1
          fi

      - name: Apply public-mirror overlay
        if: ${{ !inputs.mirror_seed_only }}
        run: |
          # Replace CLAUDE.md / add CONTRIBUTING.md / scrub the one
          # internal-lane-report reference in docs/decisions/.
          cp tools/publish/CLAUDE.md.public CLAUDE.md
          cp tools/publish/CONTRIBUTING.md.public CONTRIBUTING.md
          sed -i \
            -e 's|See `docs/lane-experience-kai-repl-watch.md` for the|See an internal lane report for the|' \
            -e 's|`docs/lane-experience-kai-repl-watch.md` is left intact as the|the internal lane report is preserved as the|' \
            docs/decisions/repl-removal-2026-05-09.md
          # Strip internal-only paths from the working tree. The mirror
          # is published as a single orphan commit, so removing the
          # files from the worktree is enough — no history rewrite,
          # no `git filter-repo`, no prune-empty hazards.
          rm -f docs/lane-experience-*.md \
                docs/lane-audit-*.md \
                docs/*audit*.md \
                docs/*honesty*.md \
                docs/*followup*.md \
                docs/nocturnal-*.md \
                tools/coverage-baseline.txt \
                tools/symbolize-rc-trace.sh \
                tools/bench-phases.sh
          rm -rf docs/formal
          # Drop the source repo's CI workflows from the mirror. They
          # are operational to lnds/kaikai (tier1 gates, daily probes,
          # this very release pipeline) and have no meaning on the
          # public snapshot. Pushing them also requires the `workflow`
          # PAT scope, which TAP_PAT intentionally does not carry —
          # keeping the mirror workflow-free is the minimum-privilege
          # path that unblocks the sync (broke v0.74.x → v0.79.x
          # consecutively before this strip landed).
          rm -rf .github/workflows
          # .github/ARCHITECTURE.md and similar non-workflow files in
          # .github/ stay; only the workflows dir requires the scope.

      - name: Push orphan snapshot as main + tag
        if: ${{ !inputs.mirror_seed_only }}
        env:
          PUBLISH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          # The mirror is intentionally history-free: a single orphan
          # commit per release containing the filtered snapshot at this
          # tag. Both `main` and `${tag}` point at the same commit,
          # which makes the VERSION-at-tag check tautological — it can
          # never drift again. This matches what the integrator did by
          # hand to recover from the 8-release outage at v0.68.1.
          # Releases on the public mirror's Releases page (with the
          # darwin-arm64 tarball) remain the canonical source of
          # historical artifacts; full development history lives on
          # lnds/kaikai.
          git config user.name "kaikai-release-bot"
          git config user.email "kaikai-release-bot@users.noreply.github.com"
          tag="${{ steps.tag.outputs.tag }}"
          git checkout --orphan public-snapshot
          git add -A
          git commit -m "release: ${tag}

          Filtered snapshot of lnds/kaikai at ${tag}.
          See https://github.com/lnds/kaikai for full development history."
          git remote add public "https://x-access-token:${PUBLISH_TOKEN}@github.com/kaikailang-org/kaikai.git"
          git push public HEAD:refs/heads/main --force
          git tag -f "$tag"
          git push public "refs/tags/${tag}" --force

      # Never moves a published seed tag: a mirror seed with the same
      # bootstrap/ is a no-op, a different one fails.
      - name: Push the bootstrap seed onto the mirror's tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          MIRROR_URL: https://x-access-token:${{ secrets.TAP_PAT }}@github.com/kaikailang-org/kaikai.git
          GIT_AUTHOR_NAME: kaikai-release-bot
          GIT_AUTHOR_EMAIL: kaikai-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: kaikai-release-bot
          GIT_COMMITTER_EMAIL: kaikai-release-bot@users.noreply.github.com
        run: |
          set -eu
          seed="bootstrap-seed-$TAG"
          export GIT_DIR="$RUNNER_TEMP/seed.git"
          git init -q --bare "$GIT_DIR"
          git fetch -q --no-tags --depth=1 "$SOURCE_URL" "refs/tags/$seed:refs/source/seed"
          if git ls-remote --exit-code "$MIRROR_URL" "refs/tags/$seed" >/dev/null; then
            git fetch -q --no-tags --depth=1 "$MIRROR_URL" "refs/tags/$seed:refs/mirror/seed"
            if [ "$(git rev-parse refs/source/seed:bootstrap)" = "$(git rev-parse refs/mirror/seed:bootstrap)" ]; then
              echo "$seed is already on the mirror with this seed"
              exit 0
            fi
            echo "::error::$seed is already on the mirror with a different seed; a seed tag is never moved"
            exit 1
          fi
          git fetch -q --no-tags --depth=1 "$MIRROR_URL" "refs/tags/$TAG:refs/mirror/release"
          tree="$({ git ls-tree "refs/mirror/release^{tree}"
                    printf '040000 tree %s\tbootstrap\n' "$(git rev-parse refs/source/seed:bootstrap)"; } \
            | git mktree)"
          commit="$(git log -1 --format=%B refs/source/seed \
            | git commit-tree "$tree" -p "refs/mirror/release^{commit}")"
          git for-each-ref --format='%(contents)' refs/source/seed | git tag -a "$seed" -F - "$commit"
          git push -q "$MIRROR_URL" "refs/tags/$seed"
