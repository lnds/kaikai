name: tier1

on:
  pull_request:
  # merge_group makes the required checks run inside a GitHub merge queue
  # (harmless while the queue is not enabled in repo settings). The queue
  # tests the batched merge result, so enabling it replaces the
  # require-branches-up-to-date re-run treadmill.
  merge_group:
  push:
    branches: [main]
    # Doc-only pushes (merged doc PRs) and `cz bump` release commits
    # (VERSION + .cz.toml + CHANGELOG.md, the latter covered by '*.md')
    # change nothing the gate tests; the merge commit that introduced code
    # already ran the full gate. No status is required on main pushes, so
    # skipping the whole workflow here is safe — the PR side must instead
    # use the `changes` job below.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'VERSION'
      - '.cz.toml'

# Superseding is right on a PR branch (only the tip matters) and wrong on
# main, where `github.ref` is constant: every merge would kill the in-flight
# run of the commit before it, and that run is the only record that the
# commit was ever verified. Cancel on pull_request only.
concurrency:
  group: tier1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The boot of stage2.c (docs/build-system.md §KAIC_BOOT). Workflow-wide: a
# job whose mode disagrees with the artifact's stage2.c.id rebuilds stage2.c.
env:
  KAIC_BOOT: release

# CI structure (docs/ci-time-analysis.md). The tier1 gate's light fixture
# pool is CPU-bound + independent, so it is sharded across SEPARATE
# runners (each with its own memory bus — in-job `-j` is bandwidth-capped).
# A single `build` job bootstraps the C-only kaic2 ONCE and publishes it as
# an artifact; tier0, the tier1 shards, tier1-asan and tier1-tsan consume it
# (download + a dependency-ordered mtime touch so `make` rebuilds nothing).
# `fast-gates` needs no compiler and runs beside `build`, so the source-only
# audits fail within minutes. Artifacts do not cross workflows, which is why
# the sanitizer gates live here. The `tier1` aggregator job gates on every
# shard; `tier1-tsan` is a separate REQUIRED check reported by its own job.
jobs:
  # Shared doc-only detection for PRs. Pure-doc PRs short-circuit every
  # downstream job with SUCCESS so the required `tier1` check is satisfied
  # without spending build/test runners. (paths-ignore can't be used on the
  # PR side: branch protection lists `tier1` as required, so the workflow
  # must always produce a status — paths-ignore would leave doc PRs BLOCKED
  # forever. Pushes to main need no status, so they use paths-ignore above.)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      doc-only: ${{ steps.doc-only.outputs.skip }}
      compiler-touch: ${{ steps.compiler-touch.outputs.touch }}
      asan: ${{ steps.asan.outputs.run }}
      tsan: ${{ steps.tsan.outputs.run }}
      wasm: ${{ steps.wasm.outputs.run }}
      web: ${{ steps.web.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs on every PR, doc-only included; `tier1` fails when this job does.
      - name: No Claude attribution trailer in the PR body or commits
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: tools/check-attribution-trailers.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Detect doc-only diff
        id: doc-only
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ -z "$CHANGED" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NON_DOC=$(echo "$CHANGED" | grep -Ev '^(docs/|[^/]+\.md$|LICENSE$)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Doc-only PR; skipping tier1 build + shards."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Gates the shard-4 whole-compiler self-hosts: they only detect
      # regressions introduced by changes to the sources they compile.
      # PR-only — on push/merge_group the self-hosts always run.
      - name: Detect compiler-source diff
        id: compiler-touch
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "touch=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ -z "$CHANGED" ]; then
            echo "touch=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COMPILER=$(echo "$CHANGED" | grep -E '^(stage2/compiler/|stdlib/|stage2/main\.kai$|stage2/Makefile$|stage2/runtime[^/]*\.h$|stage2/runtime/|stage0/runtime[^/]*\.h$)' || true)
          if [ -z "$COMPILER" ]; then
            echo "touch=false" >> "$GITHUB_OUTPUT"
            echo "No compiler-source changes; shard-4 skips the self-hosts."
          else
            echo "touch=true" >> "$GITHUB_OUTPUT"
          fi
      # Scope of the tier1-asan shards: the code that can produce a
      # memory-shape regression. Non-PR events always run.
      - name: Does this diff reach the ASAN surface?
        id: asan
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          if echo "$CHANGED" | grep -qE '^(stage0/|stage1/compiler\.kai$|stage2/compiler/|stage2/runtime\.h$|stage2/runtime/|stage2/Makefile$|stage2/tests/segment_.*\.c$|stdlib/|examples/effects/|examples/segments/|examples/perceus/|\.github/workflows/tier1\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Diff does not reach the ASAN surface; tier1-asan skipped."
          fi
      # Scope of tier1-wasm and tier1-wasi: the runtime, the host module, the parity harness and the WASI target.
      - name: Does this diff reach the WebAssembly surface?
        id: wasm
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          if echo "$CHANGED" | grep -qE '^(stage2/runtime\.h$|stage2/runtime/|stage2/web/|examples/web/|tools/test-backend-parity\.sh$|tools/lib/corpus\.sh$|tools/wasm-parity-baseline\.txt$|examples/wasi/|tools/wasi-parity-baseline\.txt$|tools/test-wasi\.sh$|tools/kai/cli_wasi?m?\.kai$|\.github/workflows/tier1\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Diff does not reach the WebAssembly surface; tier1-wasm skipped."
          fi
      # Scope of the tier1-web gate: the wasm32-browser target and its host.
      - name: Does this diff reach the browser target?
        id: web
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          if echo "$CHANGED" | grep -qE '^(tools/kai/|tools/test-web\.sh$|tools/web-driver\.py$|stage2/web/|stage2/runtime\.h$|stage2/runtime/|examples/web/|scripts/build-release\.sh$|\.github/workflows/tier1\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Diff does not reach the browser target; tier1-web skipped."
          fi
      # Scope of the tier1-tsan gate: the code that can produce a data race
      # under the M:N scheduler. Non-PR events always run.
      - name: Does this diff reach the M:N surface?
        id: tsan
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          MATCHED=$(echo "$CHANGED" | grep -E \
            '^(stage0/runtime\.h|stage0/runtime_llvm\.c|stage2/runtime.*\.h|stage2/Makefile|stage2/tests/segment_runtime_test\.c|stdlib/(actor|spawn)\.kai|examples/effects/mn_.*|examples/llvm/cancel_raise_in_fiber_under_mailbox\.kai|demos/parallel_actors/.*|tools/(run-mn-tsan|run-mn-reactor-bench|run-mn-idle-cpu|run-mn-deadlock-banner|ci-bounded-step|ci-touch-build)\.sh|tools/lib/timeout\.sh|\.github/workflows/tier1\.yml)$' \
            || true)
          if [ -z "$MATCHED" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Diff touches no M:N surface; tier1-tsan reports without running."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "M:N surface touched:"; echo "$MATCHED"
          fi

  # The tier0 gates that read only sources and scripts (`make fast-gates`).
  # They need no compiler, so this job starts as soon as `changes` finishes
  # and a break reports in minutes instead of after the build.
  fast-gates:
    needs: changes
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      # `km` (the kimun crate) backs the differential quality bar in
      # tools/km-new-files-gate.sh. Pinned: a kimun release changes grades,
      # and a PR that touched no code must not go red for that. Keep the
      # version in step with KIMUN_VERSION in the gate script.
      - name: Cache kimun
        id: cache-kimun
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/km
          key: kimun-0.45.0-${{ runner.os }}
      - name: Install kimun
        if: steps.cache-kimun.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/lnds/kimun/releases/download/v0.45.0
          tgz=km-x86_64-unknown-linux-gnu.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$tgz" "$base/$tgz" -o checksums-sha256.txt "$base/checksums-sha256.txt"
          grep "  $tgz\$" checksums-sha256.txt | sha256sum -c -
          mkdir -p ~/.cargo/bin
          tar -xzf "$tgz" -C ~/.cargo/bin km
      - name: fast gates (audits, ledgers, wiring, hermetic script tests)
        run: make CC=clang fast-gates
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after fast-gates; build artifacts leaked into tracked paths"
            git status; exit 1
          fi

  # Build the C-only kaic2 once and publish the bootstrap chain. Every
  # consuming job downloads this instead of paying the bootstrap again.
  # Runs for doc-only PRs too: their sources match main's, so the exact-key
  # cache below hits and `doc-blocks` gets a compiler in seconds.
  build:
    needs: changes
    runs-on: ubuntu-latest
    # A release boot compiles the whole compiler twice. Headroom for a slow
    # runner: a cancel here re-runs every job behind it.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      # Exact-match cache of the whole bootstrap chain: a hit means the
      # sources that feed kaic2 are byte-identical to a prior green build,
      # so the bootstrap is skipped (docs/CI/examples-only PRs).
      # Deliberately NO restore-keys: a near-miss chain plus the mtime touch
      # would masquerade as fresh and make would rebuild nothing — a stale
      # kaic2 presented as current. Exact hit or full bootstrap, nothing
      # in between.
      - name: Fingerprint toolchain for cache key
        id: cc-fp
        run: echo "id=$(clang --version | head -1 | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      # The boot is part of the chain's identity: the key names the release it resolves to.
      - name: Resolve the release boot
        id: boot
        run: |
          id="$(tools/kaic-boot.sh release-id)"
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache bootstrap chain (exact source match only)
        id: bootstrap-cache
        uses: actions/cache@v4
        with:
          path: |
            stage0/*.o
            stage0/kaic0
            stage1/kaic1
            stage1/build/stage1.c
            stage2/kaic2
            stage2/build/stage2.c
            stage2/build/stage2.c.id
            stage2/build/kaic2.id
          key: kaic2-c-${{ steps.cc-fp.outputs.id }}-${{ steps.boot.outputs.id }}-${{ hashFiles('Makefile', 'EDITION', 'stage0/**', 'stage1/**', 'stage2/**', 'stdlib/**', 'tools/ci-touch-build.sh', 'tools/kaic-boot.sh', 'tools/kaic-link.sh') }}
      # Both hops are linked from one translation unit per module, compiled on
      # every core (tools/kaic-link.sh). Each object is keyed by everything
      # cc reads for it, so a near-miss restore is sound here: an object whose
      # inputs changed is not found, and is compiled. Saved from main only: a
      # PR restores main's objects and compiles the modules it touches.
      - name: Restore boot objects
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: stage2/build/obj-cache
          key: kaic2-c-obj-${{ steps.cc-fp.outputs.id }}-${{ github.sha }}
          restore-keys: |
            kaic2-c-obj-${{ steps.cc-fp.outputs.id }}-
      # kaic1 is not the boot; it ships because tier1 still tests stage 1.
      - name: Build kaic1 and the release-booted C-only kaic2
        if: steps.bootstrap-cache.outputs.cache-hit != 'true'
        env:
          KAIC_BOOT_MODULAR: 1
        run: make CC=clang kaic1 kaic2
      - name: Save boot objects
        if: steps.bootstrap-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: stage2/build/obj-cache
          key: kaic2-c-obj-${{ steps.cc-fp.outputs.id }}-${{ github.sha }}
      - name: Mark cached chain fresh (no rebuild)
        if: steps.bootstrap-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaic2-c
          # Only the dependency chain `make` consults to decide up-to-date.
          # NOT stage2/build/*.c fixture outputs (hundreds of MB of test
          # litter that the test jobs regenerate anyway).
          path: |
            stage0/*.o
            stage0/kaic0
            stage1/kaic1
            stage1/build/stage1.c
            stage2/kaic2
            stage2/build/stage2.c
            stage2/build/stage2.c.id
            stage2/build/kaic2.id
          retention-days: 1
          if-no-files-found: error

  # Every fenced kaikai block in the current docs builds, parses or is
  # rejected as its tag says. Runs on every PR, doc-only ones included.
  doc-blocks:
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: Doc blocks
        run: make CC=clang test-doc-blocks

  # The tier0 gates that need a built kaic2 (`make kaic2-gates`): namespace,
  # symid, builtin tables, demos baseline, heap-ceiling.
  # Consumes the shared kaic2 (selfhost re-runs the binary twice and diffs —
  # determinism coverage is unchanged by sharing the build).
  tier0:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: tier0 gates that need kaic2 (namespace, symid, builtin tables, demos baseline)
        run: make CC=clang kaic2-gates
      # A PR labelled `runtime-text-identical` claims that stage2/runtime.h
      # still preprocesses to the text its base has, so that no existing
      # platform compiles anything new. Held to it under both compilers. The
      # label is read when the step runs, not from the event: a label set
      # after the PR opened counts on a re-run.
      - name: The runtime preprocesses to the text of the base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name')"
          printf '%s\n' "$labels" | grep -qx runtime-text-identical \
            || { echo "not labelled runtime-text-identical: nothing claimed"; exit 0; }
          CC=gcc tools/runtime-preprocess-diff.sh "${{ github.event.pull_request.base.sha }}"
          CC=clang tools/runtime-preprocess-diff.sh "${{ github.event.pull_request.base.sha }}"
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier0; build artifacts leaked into tracked paths"
            git status; exit 1
          fi

  tier1-shard-1:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    # A ceiling adjacent to the nominal time turns a slow runner into cancel
    # + full re-run, which costs far more than headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: tier1-shard-1 (costly self-compiles + caches + light slice)
        run: make CC=clang tier1-shard-1 TIER1_SELFHOSTS=${{ needs.changes.outputs.compiler-touch == 'true' && 1 || 0 }}
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-shard-1"
            git status; exit 1
          fi

  tier1-shard-2:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    # Same headroom as shard-1: the tier1 slices run near the ceiling and a
    # slow runner has timed the demos slice out at 25.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: tier1-shard-2 (light slice + namespace-collision corpus)
        run: make CC=clang tier1-shard-2 TIER1_SELFHOSTS=${{ needs.changes.outputs.compiler-touch == 'true' && 1 || 0 }}
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-shard-2"
            git status; exit 1
          fi

  tier1-shard-3:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    # Same headroom as the other tier1 slices, which run near the ceiling.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: tier1-shard-3 (light slice + linearity + core text + fmt meaning-preservation 1/3 + namespace-collision C-modular axes)
        run: make CC=clang tier1-shard-3 TIER1_SELFHOSTS=${{ needs.changes.outputs.compiler-touch == 'true' && 1 || 0 }}
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-shard-3"
            git status; exit 1
          fi

  # Shard 4 — the whole-compiler modular self-host + a light slice. On PRs
  # that touch no compiler source the self-host proves nothing, so the make
  # step passes TIER1_SELFHOSTS=0 and only the light slice runs; the light
  # slice must never be skipped. A job-level `if` would mark shard-4
  # `skipped`, the aggregator requires `success`, and the required check
  # would hang red.
  tier1-shard-4:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    # Twice killed at its ceiling by 2x-slow runners while every test passed;
    # headroom is free on a healthy runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      # Persist the c-modular .o cache the two full-compiler self-hosts
      # (test-modular-selfhost, test-perceus-1131-modular-escape) share. The
      # cache keys each .o by a content hash of the emitted C + headers +
      # toolchain, so a stale entry is impossible — a mismatch just misses and
      # recompiles. actions/cache only ferries the objects; it cannot produce a
      # false green. The key folds a compiler-source fingerprint (so a warm
      # start correlates with reusable objects) and the clang identity (so a
      # runner-image clang bump does not carry objects from the old compiler);
      # restore-keys lets a run warm-start from the nearest prior cache and let
      # the content hash sort out which objects survive.
      - name: Fingerprint toolchain for cache key
        id: cc-fp
        if: needs.changes.outputs.compiler-touch == 'true'
        run: echo "id=$(clang --version | head -1 | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache c-modular .o objects (self-host self-compiles)
        if: needs.changes.outputs.compiler-touch == 'true'
        uses: actions/cache@v4
        with:
          path: stage2/build/cmodular-selfhost-cache
          key: cmodular-selfhost-${{ steps.cc-fp.outputs.id }}-${{ hashFiles('stage2/compiler/**', 'stage2/main.kai', 'stdlib/**', 'stage2/runtime*.h', 'stage2/runtime/**', 'stage0/runtime*.h') }}
          restore-keys: |
            cmodular-selfhost-${{ steps.cc-fp.outputs.id }}-
      - name: tier1-shard-4 (whole-compiler modular self-host + RC leak ledger first half + light slice)
        run: make CC=clang tier1-shard-4 TIER1_SELFHOSTS=${{ needs.changes.outputs.compiler-touch == 'true' && 1 || 0 }}
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-shard-4"
            git status; exit 1
          fi

  # Shard 6 — the modular-escape gate + fmt meaning-preservation 2/3 + a
  # light slice.
  #
  # The gate and shard-4's self-host both rebuild the whole compiler under
  # --emit=c-modular; together they overran one job whenever the PR touched
  # stage2/compiler/**, which moves the object-cache key and forces a cold
  # rebuild. Same TIER1_SELFHOSTS gating as shard-4.
  tier1-shard-6:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    # The self-host alone varies twofold across runners; headroom is free on a
    # healthy runner.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: Fingerprint toolchain for cache key
        id: cc-fp
        if: needs.changes.outputs.compiler-touch == 'true'
        run: echo "id=$(clang --version | head -1 | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      # Same cache as shard-4, keyed identically: the two jobs compile the
      # same objects, so whichever lands first warms the other.
      - name: Cache c-modular .o objects (self-host self-compiles)
        if: needs.changes.outputs.compiler-touch == 'true'
        uses: actions/cache@v4
        with:
          path: stage2/build/cmodular-selfhost-cache
          key: cmodular-selfhost-${{ steps.cc-fp.outputs.id }}-${{ hashFiles('stage2/compiler/**', 'stage2/main.kai', 'stdlib/**', 'stage2/runtime*.h', 'stage2/runtime/**', 'stage0/runtime*.h') }}
          restore-keys: |
            cmodular-selfhost-${{ steps.cc-fp.outputs.id }}-
      - name: tier1-shard-6 (modular-escape gate + fmt meaning-preservation 2/3 + light slice)
        run: make CC=clang tier1-shard-6 TIER1_SELFHOSTS=${{ needs.changes.outputs.compiler-touch == 'true' && 1 || 0 }}
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-shard-6"
            git status; exit 1
          fi

  # Shard 5 — fmt fixtures, packages, editions, kai info + a light slice.
  tier1-shard-5:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: tier1-shard-5 (fmt + packages + kai info + light slice)
        run: make CC=clang tier1-shard-5 TIER1_SELFHOSTS=${{ needs.changes.outputs.compiler-touch == 'true' && 1 || 0 }}
      # clang evaluates C call arguments left to right, so only gcc on
      # x86_64 exposes an operand the C emitter left unsequenced.
      - name: C operand evaluation order under gcc (x86_64)
        if: ${{ !cancelled() }}
        run: make CC=clang test-eval-order-gcc
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-shard-5"
            git status; exit 1
          fi

  # Shards 7 and 8 — the CLI/tooling tail (7) or the last third of the fmt
  # meaning-preservation corpus (8), plus a light slice.
  #
  # The fmt-property thirds (shards 3, 6, 8) run unconditionally: the corpus
  # can regress from a stdlib or fixture change, so gating them on
  # `compiler-touch` would leave the formatter gate silently inert exactly
  # when nobody touched the formatter. The aggregator's view of this job is
  # green only when both shards are.
  tier1-shard-7:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [7, 8]
    name: tier1-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: tier1-shard-${{ matrix.shard }} (CLI tail, or fmt meaning-preservation 3/3; + light slice)
        run: make CC=clang tier1-shard-${{ matrix.shard }} TIER1_SELFHOSTS=${{ needs.changes.outputs.compiler-touch == 'true' && 1 || 0 }}
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-shard-${{ matrix.shard }}"
            git status; exit 1
          fi

  # Demos and the -asan fixture legs under ASAN+UBSan, sharded in two; each
  # shard runs its legs under `make -j` (see tier1-asan in the Makefile). The sanitizers
  # instrument the fixture binaries, not kaic2, so the shared build serves.
  # Path-gated and not a required check: it reports only where it runs.
  tier1-asan:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true' && needs.changes.outputs.asan == 'true'
    strategy:
      # A red shard keeps its sibling running: the other half's legs are
      # diagnostic signal, not redundant work.
      fail-fast: false
      matrix:
        shard: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      # Bounded under `timeout-minutes` so a demo that wedges under ASAN
      # fails here, named, instead of reporting `cancelled` — the conclusion
      # a routine supersede also produces.
      - name: tier1-asan-${{ matrix.shard }} (demos + fixture legs under ASAN+UBSan)
        run: ./tools/ci-bounded-step.sh 1200 "tier1-asan-${{ matrix.shard }} (ASAN+UBSan)" make CC=clang tier1-asan-${{ matrix.shard }}
      - name: Working tree clean check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-asan-${{ matrix.shard }}; build artifacts leaked into tracked paths"
            git status; exit 1
          fi

  # The parity corpus built for wasm32 and run under node with the shipped
  # host, against the C oracle, as a ratchet (tools/wasm-parity-baseline.txt).
  # Not a required check, and not in `tier1`'s needs.
  tier1-wasm:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true' && needs.changes.outputs.wasm == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WASI_SDK_VERSION: "34.0"
      WASI_SDK_SHA256: "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Fetch wasi-sdk (pinned, checksum verified)
        run: |
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" "$url"
          echo "${WASI_SDK_SHA256}  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: tier1-wasm-${{ matrix.shard }} (corpus under node vs the C oracle)
        run: |
          . tools/lib/corpus.sh
          all="$KAI_CORPUS_DEFAULT_DIRS examples/web"
          case "${{ matrix.shard }}" in
            a) dirs=$(echo $all | tr ' ' '\n' | awk 'NR % 3 == 1') ;;
            b) dirs=$(echo $all | tr ' ' '\n' | awk 'NR % 3 == 2') ;;
            c) dirs=$(echo $all | tr ' ' '\n' | awk 'NR % 3 == 0') ;;
          esac
          TARGET_BACKEND=wasm NATIVE_PARITY_RATCHET=1 BACKEND_PARITY_DIRS="$dirs" \
            ./tools/ci-bounded-step.sh 2400 "tier1-wasm-${{ matrix.shard }}" tools/test-backend-parity.sh

  # The parity corpus built for wasm32-wasi and run under wasmtime, against the
  # C oracle, as a ratchet (tools/wasi-parity-baseline.txt), and the target's
  # own checks. Not a required check, and not in `tier1`'s needs.
  tier1-wasi:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true' && needs.changes.outputs.wasm == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WASI_SDK_VERSION: "34.0"
      WASI_SDK_SHA256: "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"
      WASMTIME_VERSION: "49.0.2"
      WASMTIME_SHA256: "a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - name: Fetch wasi-sdk (pinned, checksum verified)
        run: |
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" "$url"
          echo "${WASI_SDK_SHA256}  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "KAI_WASI_SDK=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - name: Fetch wasmtime (pinned, checksum verified)
        run: |
          url="https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/wasmtime.tar.xz" "$url"
          echo "${WASMTIME_SHA256}  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasmtime"
          tar xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP/wasmtime" --strip-components=1
          echo "$RUNNER_TEMP/wasmtime" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - name: Build the kai wrapper
        run: make bin/kai
      - name: tier1-wasi-${{ matrix.shard }} (corpus under wasmtime vs the C oracle)
        run: |
          . tools/lib/corpus.sh
          all="$KAI_CORPUS_DEFAULT_DIRS examples/wasi"
          case "${{ matrix.shard }}" in
            a) dirs=$(echo $all | tr ' ' '\n' | awk 'NR % 3 == 1') ;;
            b) dirs=$(echo $all | tr ' ' '\n' | awk 'NR % 3 == 2') ;;
            c) dirs=$(echo $all | tr ' ' '\n' | awk 'NR % 3 == 0') ;;
          esac
          TARGET_BACKEND=wasi NATIVE_PARITY_RATCHET=1 BACKEND_PARITY_DIRS="$dirs" \
            ./tools/ci-bounded-step.sh 2400 "tier1-wasi-${{ matrix.shard }}" tools/test-backend-parity.sh
      - name: tier1-wasi target checks (run, args, env, exit status, refusals)
        if: matrix.shard == 'a'
        run: ./tools/ci-bounded-step.sh 600 "tier1-wasi-target" tools/test-wasi.sh

  # The wasm32-browser target: pinned toolchain fetched from an empty cache,
  # fixtures run under node and in headless Chrome and Firefox. Not required.
  tier1-web:
    needs: [changes, build]
    if: needs.changes.outputs.doc-only != 'true' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the kai wrapper
        run: make bin/kai
      - name: Browser drivers on PATH
        run: |
          echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
          echo "$GECKOWEBDRIVER" >> "$GITHUB_PATH"
      - name: tier1-web (node, Chrome, Firefox)
        run: ./tools/ci-bounded-step.sh 1500 "tier1-web" tools/test-web.sh
        env:
          BROWSERS: "chrome firefox"

  # M:N ThreadSanitizer, reactor no-starvation and deadlock-banner gates.
  # A REQUIRED check, so it must report on every PR: it runs whenever the
  # workflow is not cancelled and self-skips with SUCCESS when the diff
  # misses the M:N surface. A job-level path `if` would leave it `skipped`
  # behind a skipped build on doc-only PRs.
  tier1-tsan:
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scope gate to the M:N surface
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::tier1-tsan FAIL — the changes job did not succeed"; exit 1
          fi
          if [ "${{ needs.changes.outputs.tsan }}" != "true" ]; then
            echo "tier1-tsan OK — PR touches no M:N surface; the race gate is not exercised."; exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::tier1-tsan FAIL — the shared kaic2 build did not succeed"; exit 1
          fi
      - uses: actions/checkout@v4
        if: needs.changes.outputs.tsan == 'true'
      - name: Install toolchain
        if: needs.changes.outputs.tsan == 'true'
        run: ./tools/ci-install-toolchain.sh
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.tsan == 'true'
        with:
          name: kaic2-c
      - name: Restore artifact mtimes (no rebuild)
        if: needs.changes.outputs.tsan == 'true'
        run: |
          chmod +x stage0/kaic0 stage1/kaic1 stage2/kaic2
          ./tools/ci-touch-build.sh
      # Each gate is bounded well under `timeout-minutes`: the gate exists to
      # catch a scheduler that wedges, and an unbounded wedge reports the job
      # as `cancelled`, like a routine supersede. Nominal is ~10 s per gate.
      - name: M:N ThreadSanitizer + determinism gate
        if: needs.changes.outputs.tsan == 'true'
        run: ./tools/ci-bounded-step.sh 600 "tier1-tsan M:N ThreadSanitizer gate" make CC=clang test-mn-tsan
      - name: F2 reactor no-starvation gate
        if: needs.changes.outputs.tsan == 'true'
        run: ./tools/ci-bounded-step.sh 300 "tier1-tsan F2 reactor no-starvation gate" make CC=clang test-mn-reactor-bench
      - name: M:N idle-CPU gate
        if: needs.changes.outputs.tsan == 'true'
        run: ./tools/ci-bounded-step.sh 300 "tier1-tsan M:N idle-CPU gate" make CC=clang test-mn-idle-cpu
      - name: Deadlock-banner determinism gate
        if: needs.changes.outputs.tsan == 'true'
        run: ./tools/ci-bounded-step.sh 600 "tier1-tsan deadlock-banner determinism gate" make CC=clang test-mn-deadlock-banner
      - name: Stack-segment ThreadSanitizer gate
        if: needs.changes.outputs.tsan == 'true'
        run: ./tools/ci-bounded-step.sh 300 "tier1-tsan stack-segment gate" make -C stage2 CC=clang test-segment-runtime-tsan
      - name: Working tree clean check
        if: needs.changes.outputs.tsan == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree dirty after tier1-tsan"
            git status; exit 1
          fi

  # Compile-cost A/B against the PR's base, posted as one updating PR comment.
  # Not in the tier1 aggregator's `needs`: it informs, never blocks, and runs
  # beside the shards. The base compiler comes from the exact-match bootstrap
  # cache (main's build saved it) and is built here only on a miss.
  cost-ab:
    needs: [changes, build]
    if: github.event_name == 'pull_request' && needs.changes.outputs.compiler-touch == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base sits at the workspace root, like the build job's tree: the
      # cache version is derived from the path list, so a restore finds
      # main's entry only when the paths are spelled identically. The root
      # checkout goes first: checking out into a non-empty root wipes it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The PR artifact is built from the merge commit, so the base is the
      # commit it was merged onto: newer main sources may use what the
      # artifact's compiler lacks.
      - name: Pick the base commit
        id: base-sha
        run: |
          if git rev-parse --verify -q HEAD^2 >/dev/null; then
            sha="$(git rev-parse HEAD^1)"
          else
            sha="${{ github.event.pull_request.base.sha }}"
            git fetch --depth=1 origin "$sha"
          fi
          git checkout -q --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 2
      - name: Install toolchain
        working-directory: head
        run: ./tools/ci-install-toolchain.sh
      - name: Fingerprint toolchain for cache key
        id: cc-fp
        run: echo "id=$(clang --version | head -1 | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"
      - name: Resolve the release boot
        id: boot
        run: |
          id="$(tools/kaic-boot.sh release-id)"
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the base bootstrap chain
        id: base-cache
        uses: actions/cache@v4
        with:
          path: |
            stage0/*.o
            stage0/kaic0
            stage1/kaic1
            stage1/build/stage1.c
            stage2/kaic2
            stage2/build/stage2.c
            stage2/build/stage2.c.id
            stage2/build/kaic2.id
          key: kaic2-c-${{ steps.cc-fp.outputs.id }}-${{ steps.boot.outputs.id }}-${{ hashFiles('Makefile', 'EDITION', 'stage0/**', 'stage1/**', 'stage2/**', 'stdlib/**', 'tools/ci-touch-build.sh', 'tools/kaic-boot.sh', 'tools/kaic-link.sh') }}
      - name: Restore boot objects
        if: steps.base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: stage2/build/obj-cache
          key: kaic2-c-obj-${{ steps.cc-fp.outputs.id }}-${{ steps.base-sha.outputs.sha }}
          restore-keys: |
            kaic2-c-obj-${{ steps.cc-fp.outputs.id }}-
      - name: Build the base compiler
        if: steps.base-cache.outputs.cache-hit != 'true'
        env:
          KAIC_BOOT_MODULAR: 1
        run: make CC=clang kaic1 kaic2
      - uses: actions/download-artifact@v4
        with:
          name: kaic2-c
          path: pr-artifact
      - name: Measure and post
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          chmod +x stage2/kaic2 pr-artifact/stage2/kaic2
          # Required: self-compile or the empty program up by more than 1% fails the PR.
          rc=0
          head/tools/cost-ab.sh --markdown --rounds 5 --fail-above 1 --base-tree "$PWD" --branch-tree "$PWD/head" \
            stage2/kaic2 pr-artifact/stage2/kaic2 > cost-ab.md || rc=$?
          cat cost-ab.md
          {
            echo '<!-- cost-ab -->'
            echo "### Compile cost vs \`${GITHUB_BASE_REF}\` (\`${{ steps.base-sha.outputs.sha }}\`)"
            echo
            cat cost-ab.md
            echo
            echo '_`tools/cost-ab.sh --fail-above 1`: self-compile or the empty program up by more than 1% fails this check. Re-run locally with `tools/cost-ab.sh --base origin/main`._'
          } > comment.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- cost-ab -->")) | .id' | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
          exit $rc

  # Aggregator: the REQUIRED check. Green iff fast-gates, tier0, every shard and, when
  # the diff reaches its paths, tier1-asan are green: a job left out of
  # `needs` runs without blocking anything. Keeping the name `tier1` means
  # branch protection needs no edit. A doc-only PR reaches here via the
  # skipped jobs and still reports SUCCESS, satisfying the required check.
  tier1:
    needs: [changes, fast-gates, doc-blocks, tier0, tier1-shard-1, tier1-shard-2, tier1-shard-3, tier1-shard-4, tier1-shard-5, tier1-shard-6, tier1-shard-7, tier1-asan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on fast-gates, doc-blocks, tier0, all shards and tier1-asan
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::tier1 FAIL — the changes job did not succeed (see its log)"; exit 1
          fi
          if [ "${{ needs.doc-blocks.result }}" != "success" ]; then
            echo "::error::tier1 FAIL — doc-blocks did not succeed"; exit 1
          fi
          if [ "${{ needs.changes.outputs.doc-only }}" = "true" ]; then
            echo "tier1 OK — doc-only PR: doc blocks green, shards skipped"; exit 0
          fi
          rf='${{ needs.fast-gates.result }}'
          r0='${{ needs.tier0.result }}'
          r1='${{ needs.tier1-shard-1.result }}'
          r2='${{ needs.tier1-shard-2.result }}'
          r3='${{ needs.tier1-shard-3.result }}'
          r4='${{ needs.tier1-shard-4.result }}'
          r5='${{ needs.tier1-shard-5.result }}'
          r6='${{ needs.tier1-shard-6.result }}'
          r7='${{ needs.tier1-shard-7.result }}'
          ra='${{ needs.tier1-asan.result }}'
          asan='${{ needs.changes.outputs.asan }}'
          echo "results: fast-gates=$rf tier0=$r0 shards 1=$r1 2=$r2 3=$r3 4=$r4 5=$r5 6=$r6 7=$r7 asan=$ra (in scope: $asan)"
          if [ "$rf" != "success" ]; then
            echo "::error::tier1 FAIL — fast-gates did not succeed"; exit 1
          fi
          if [ "$r0" != "success" ]; then
            echo "::error::tier1 FAIL — tier0 did not succeed"; exit 1
          fi
          if [ "$r1" != "success" ] || [ "$r2" != "success" ] || [ "$r3" != "success" ] || [ "$r4" != "success" ] || [ "$r5" != "success" ] || [ "$r6" != "success" ] || [ "$r7" != "success" ]; then
            echo "::error::tier1 FAIL — a shard did not succeed"; exit 1
          fi
          if [ "$asan" = "true" ] && [ "$ra" != "success" ]; then
            echo "::error::tier1 FAIL — tier1-asan did not succeed"; exit 1
          fi
          echo "tier1 OK — fast-gates, tier0, all shards and tier1-asan (when in scope) green"
